# THE CANONICAL PYTEST CONFIGURATION (U-HANDOFF-1C, H-2).
#
# The hostile reviewer injected pytest addopts that silently removed 31 tests while producing
# zero failures and zero deselections. Every canonical execution surface (local runs, the
# clean-clone gate, status finalization, manifest generation) therefore uses THIS file via an
# explicit `-c` path, which makes pytest ignore pyproject/tox/setup.cfg ini options and any
# parent-directory configuration entirely. The canonical runner additionally clears
# PYTEST_ADDOPTS from the environment. The exact node-ID manifest
# (docs/implementation/TEST-NODE-MANIFEST.json) then catches anything configuration isolation
# cannot - including plugin-induced collection loss - because a missing NODE is detected by
# identity, not by count.
#
# This file's sha256 is recorded in every suite-result artifact; a run under a different
# configuration cannot back the status record.
[pytest]
pythonpath = src
testpaths = eval
addopts = -p no:cacheprovider
