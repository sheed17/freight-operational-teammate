[project]
name = "freight-recon"
version = "0.1.0"
description = "AI operational teammate for freight brokerages: carrier-invoice-to-rate-con reconciliation engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "instructor>=1.5",
    "anthropic>=0.39",
    "openai>=1.40",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "pillow>=10.0",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
browser-agent = [
    "browser-use[core]==0.13.1",
]
# The PostgreSQL backend (ADR-016: "PostgreSQL is the production transactional store"). An EXTRA
# rather than a base dependency because `persistence.py` imports it lazily and only for that
# backend - SQLite needs nothing, and ADR-016 explicitly retains SQLite "for local development and
# deterministic testing". So a clean clone installs no database driver it does not use, and the
# canonical suite never imports psycopg; `scripts/postgres_p5_gate.py` is what needs it.
postgres = [
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_recon"]

[tool.pytest.ini_options]
# One pytest configuration, used by developers and by CI alike. `pytest` with no arguments runs
# the canonical population; there is no second "canonical" ini file to get out of step with it.
# CI additionally clears PYTEST_ADDOPTS and passes -p no:cacheprovider, so ambient configuration
# cannot silently reshape the run.
pythonpath = ["src"]
testpaths = ["eval"]
