# OPERATIONAL USE-CASE COVERAGE MATRIX
#
# CANONICAL product authority (U-REBASELINE-1, founder-authorized). The ONE canonical coverage
# matrix: for every major operational use case it records role, loop, workflow/outcome, systems,
# source of truth, authority, evidence, exception classes, closure condition, owner-value metric,
# design-partner validation status, implementation phase, readiness tier, and a single
# classification. Guarded by eval/tests/test_rebaseline_invariants.py.
#
# HONESTY RULES (do not violate):
#   - No freight rule is fabricated. Where a rule is customer-specific it is NEEDS_VALIDATION.
#   - No claim that every transportation mode is validated; mode-specific work is
#     REQUIRES_MODE_SPECIFIC_VALIDATION.
#   - readiness_tier uses the seven canonical tiers (PROGRESS-PROTOCOL.md sec 5); every freight use
#     case is SPECIFIED today because no freight/product capability has been implemented - the
#     completed post-P2 work is the safety foundation (P3 checkpoint kernel, COMPLETE and dark)
#     plus P4 adapter containment, COMPLETE and adjudicated, with R-07 recorded CONTAINED and
#     production writes still dark; P5 is COMPLETE - ADJUDICATED at 14/14 (canonical events,
#     outbox/inbox, replay isolation, audit reconstruction, durable timers, production PostgreSQL),
#     independently reviewed with zero material blocking defects and separately adjudicated, and
#     shipping dark with zero production callers; P6 is the sole READY unit and has NOT STARTED as
#     a recorded state - the tree carries a P6 CONTENT CANDIDATE (machine M1, the Work Item with
#     ownership as a recorded authority rather than a string, 14 of the 134 transitions) awaiting
#     its fresh independent review, with no landed checkpoint and no scored criterion; P7-P14 are
#     BLOCKED. Containment is not enablement: no production write is enabled.
#     SUPERSEDED / HISTORICAL, kept so the old wording is recognisable if it returns - this read
#     "plus the in-progress P4 adapter containment (READY, not COMPLETE; R-07 OPEN); P6-P14 have
#     not begun". SUPERSEDED / HISTORICAL.

meta:
  unit: U-REBASELINE-1
  authority: founder-authorized product coverage
  decision_of_record: docs/architecture/decisions/ADR-018-customer-operational-graph.md
  # A use case is EXACTLY one of these six classifications.
  classifications:
    - IN_INITIAL_COMMERCIAL_WORKFLOW      # part of the Delivered Load Closure wedge (a HYPOTHESIS)
    - PLANNED_PLATFORM_CAPABILITY         # platform/ops, not freight-rule-validation-gated
    - REQUIRES_DESIGN_PARTNER_VALIDATION  # freight workflow whose rules need the design partner
    - REQUIRES_MODE_SPECIFIC_VALIDATION   # varies by mode (LTL, drayage, reefer, flatbed, ...)
    - FUTURE_EXPANSION                    # beyond the initial ICP / program
    - EXPLICITLY_OUT_OF_SCOPE             # a different product
  wedge_note: >-
    IN_INITIAL_COMMERCIAL_WORKFLOW marks the pieces of Delivered Load Closure (PRODUCT.md sec 15).
    The wedge itself remains a HYPOTHESIS requiring design-partner validation
    (docs/product/DESIGN-PARTNER-EVIDENCE-PROGRAM.md); classification here is scope, not proof.

use_cases:
