    operational_loop: cross-cutting
    workflow_and_business_outcome: "a customer relationship is established, served and retained; revenue continuity"
    systems_channels: [CRM or spreadsheet, email, accounting]
    source_of_truth: "the brokerage's own records (CRM/sheet)"
    authority_requirement: "human for commercial commitments"
    evidence_requirement: "recorded agreements and communications, with provenance"
    exception_classes: [lapsed customer, disputed terms]
    closure_condition: "relationship state is current and correct"
    owner_value_metric: "retention; revenue per customer"
    design_partner_validation_status: NEEDS_VALIDATION
    implementation_phase: P11
    readiness_tier: SPECIFIED
    classification: PLANNED_PLATFORM_CAPABILITY

