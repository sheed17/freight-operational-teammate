# CAPABILITY TRACEABILITY — the promise-to-implementation-to-evidence spine
#
# CANONICAL / IMPLEMENTATION_CONTROL. Created by the roadmap-completeness control correction.
#
# WHY THIS FILE EXISTS. The repository could already answer "what is implemented?" (
# IMPLEMENTATION-SURFACE.yaml, by architecture concept) and "what is in scope?" (
# OPERATIONAL-USE-CASE-COVERAGE.yaml, by use case). It could NOT answer, mechanically:
# which promised freight capability belongs to which loop and phase, WHICH IMPLEMENTATION UNIT
# WILL BUILD IT, and WHICH ACCEPTANCE EVIDENCE WILL PROVE IT EXISTS. That gap is what let the
# complete roadmap look completable while promised capabilities remained only documented.
#
# WHAT IT IS NOT:
#   - NOT a product decision. Every row is DERIVED from an existing canonical source, named in
#     product_authority_reference. It creates no capability, no loop, and no scope.
#   - NOT a second status authority. Unit and phase state live in IMPLEMENTATION-REGISTRY.yaml;
#     short-form repository status lives in CURRENT.md; code reality lives in
#     IMPLEMENTATION-SURFACE.yaml. Every row names its current_truth_source and defers to it.
#   - NOT a claim that anything is built. implementation_status is the honest per-capability
#     state, and a guard checks every non-SPECIFIED claim against symbols that must exist in src/.
#   - NOT prose duplication. Rows reference the product documents; they do not restate them.
#
# COVERAGE CONTRACT (mechanically enforced by eval/tests/test_roadmap_completeness_control.py):
#   - CAP-01..CAP-18 are EXACTLY the eighteen capability areas of
#     docs/product/FREIGHT-CAPABILITY-MAP.md, in its order, by its names. One disappearing fails.
#   - CAP-19..CAP-26 cover the eight further promised subjects that are not freight capability
#     areas: the Operator, customer discovery/onboarding, the tenant Operational System Map,
#     cross-loop handoffs, workflow-authority migration, evidence/provenance, supervised effects,
#     and bounded autonomy.
#   - Every loop W1..W11 appears as an owning_loop_or_surface on at least one row AND has a P13
#     sub-unit in the registry.
#   - Every row names an owning loop or surface, an owning phase, an owning implementation unit,
#     and acceptance contracts; a unit that names no acceptance contract fails the build.
#
# VOCABULARY (all borrowed, none invented):
#   implementation_status : SPECIFIED | PARTIALLY_IMPLEMENTED | IMPLEMENTED |
#                           LEGACY_IMPLEMENTATION_ONLY   (IMPLEMENTATION-SURFACE.yaml statuses)
#   design_partner_evidence_status / historical_evaluation_status :
#                           NOT_COLLECTED | IN_PROGRESS | RECORDED
#   required_policy_classes : the ADR-010 sec 3 concepts (Principle, Permanent Product Truth,
#                           Product Policy, Tenant Policy, Rule, Constraint, Organizational
#                           Knowledge)
#   allowed_effect_classes : the action classes declared per adapter op and per loop step
#   permanent_human_boundaries : the ADR-010 gate decisions PERMANENT_HUMAN_ASSERTION_REQUIRED /
#                           HUMAN_APPROVAL_REQUIRED that no autonomy level removes (ADR-003)
#   release_gate_reference : G0..G10, docs/specifications/acceptance/release-gates.md

meta:
  unit: roadmap-completeness control correction
  authority: IMPLEMENTATION_CONTROL — traceability and sequencing, never product definition
  coverage_basis: docs/product/FREIGHT-CAPABILITY-MAP.md (the eighteen capability areas)
  loop_index: docs/specifications/workflows/registry.md (the sole canonical index of W1–W11)
  unit_authority: docs/implementation/IMPLEMENTATION-REGISTRY.yaml
  code_reality_authority: docs/implementation/IMPLEMENTATION-SURFACE.yaml
  scope_classification_authority: docs/product/OPERATIONAL-USE-CASE-COVERAGE.yaml
  status_authority: docs/implementation/CURRENT.md
  honesty_rules: >-
    No freight rule is invented here. No capability is marked implemented without a source symbol
    that exists in src/ and an executable reference. A legacy pre-reset module is NEVER cited as
    the target implementation of a canonical capability - where one exists it is recorded as
    LEGACY_IMPLEMENTATION_ONLY with its disposition, because the canonical capability is the thing
    that module will be replaced by, not evidence that it is built. A historical prototype is not
    proof of canonical implementation.
  completeness_rule: >-
    THE ROADMAP IS COMPLETE IF AND ONLY IF every required phase is COMPLETE, every required P13
    sub-unit is COMPLETE, every mandatory capability row below has satisfied its required
    acceptance state, and no mandatory release gate remains open. This is not a slogan: it is
    computed by roadmap_completeness_report() in
    eval/tests/test_roadmap_completeness_control.py, and the guard fails if the equivalence can be
    broken in either direction.

