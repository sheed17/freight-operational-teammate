  # ------------------------------------------------------------------------------------
  # THE IMMUTABLE REBASELINE CHANGE WINDOW (U-REBASELINE-1 remediation, P3 finding F-A).
  #
  # RB-23's src/-untouched invariant is a statement about a CLOSED, HISTORICAL unit: the
  # rebaseline was documentation/architecture/specification/control ONLY, so none of ITS OWN
  # commits may have touched production runtime code. The guard that enforced it diffed the
  # WORKING TREE against `IMPLEMENTATION-REGISTRY.yaml meta.baseline_commit` - a field the
  # finalizer REWRITES to the newest content commit. That anchor moves; the rebaseline does
  # not. Every later unit's legitimate src/ change therefore accumulated into the rebaseline's
  # population and was reported as a rebaseline violation. P3 was the first unit to touch src/
  # after the rebaseline, so P3 is where the mis-anchoring became visible - it was never a P3
  # defect. The guard is REPLACED, not relaxed (CLAUDE.md sec 5 rule 20): the invariant is
  # unchanged, only its anchor is corrected to the two commits that actually bound the unit.
  #
  # THESE TWO COMMITS AND THIS PATH SET ARE IMMUTABLE. They describe finished history. The
  # finalizer must never write here; nothing but a rewrite of published history can change them,
  # and the guard treats any divergence as exactly that.
