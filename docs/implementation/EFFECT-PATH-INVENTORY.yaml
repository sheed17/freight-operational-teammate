  - id: EP-14
    path: scripts/read_tms_browser_use.py
    external_system: mock TMS via the Browser Use adapter (optional dependency)
    production_reachable: false  # targets the mock TMS; requires the optional browser-agent extra
    enablement: manual, mock-targeted, optional-dependency-gated
    authority_bypass: none exercised; formerly actuator-capable by import - that edge is now cut
