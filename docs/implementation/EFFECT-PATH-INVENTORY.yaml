    p4_cut: >-
      DONE at P4. propose_ar_from_tms.py holds cdp_readonly.ReadOnlyCdpNavigator and imports NO
      adapter module - not cdp_actuator, not cdp_session. Its browser surface was the worst
      remaining instance of F2's defect: it navigated with
      cdp_session.evaluate("location.href=...") - caller data interpolated into JavaScript source -
      and fell back to cdp_actuator.click(load_ref) to open a load's detail page for the POD check.
      Both are removed. Detection edges 16 -> 14, violation edges 3 -> 2, no new edge anywhere
      (cdp_readonly is not an adapter module).
      WHY NAVIGATION IS NOT A NEW HOLE: the navigator adds exactly one capability over the observer,
      document fetch, and it strictly REDUCES reachable behaviour. A click dispatches the SPA's
      onclick handler, which can POST an invoice while being no kind of form submit target;
      Page.navigate never runs that handler. visit() takes only the operator-configured entry URL;
      every target is scheme-allowlisted (javascript:/data:/file:/vbscript:/blob: refused) and
      host-allowlisted to the TMS domain. The channel transmits exactly {Page.enable, Page.navigate}
      and has no script path at all.
    p4_provenance_hardening: >-
      DONE at P4, against the recorded EP-3 hostile-review obligation. The cut above accepted any URL
      the observed page had published as an <a href>. That was NOT sufficient, and the obligation's
      premise is correct: a same-origin, page-published href is not inherently read-only, because
      legacy TMS systems expose state-changing GET routes. /loads/101/delete, /invoices/9/approve,
      /logout and Rails-style <a href="/loads/101" data-method="delete"> are all same-origin anchors
      a real page renders. The caller made matters worse by selecting among them with a SUBSTRING
      match of the load ref against the document-wide nav list, so an anchor reading
      "Delete L-101" -> /loads/9/purge_all would have been followed. A live defect, not a theory.
      follow() no longer accepts a URL at all. It accepts a PROVENANCE RECORD
      (cdp_readonly.ObservedLoadLink) binding the observed row, the observed load identity, the exact
      href and the observation context, and it RE-DERIVES that record from the live page and demands
      an exact match before fetching. Four independent barriers decide membership:
        1. ROW PROVENANCE - the anchor must be contained by the one observed row whose own CELLS
           carry the load identifier. A different row's link, a page-level nav link and an unobserved
           link are not in the candidate set at all, because the set is read from the DOM.
        2. IDENTITY BINDING - the anchor's visible text must EQUAL the load identifier, or the
           identifier must appear as a whole PATH SEGMENT. Both are exact matches on a delimited
           token; no substring test decides anything, so L-101 never selects L-1010.
        3. ROUTE FAMILY - no consequential action token anywhere in the path, no destructive token
           or method-override key in the query, applied to BOTH the raw href attribute and the
           browser-resolved URL, so a <base> tag cannot make a benign attribute resolve elsewhere.
           The navigator fetches the resolved URL, so the target classified is the target fetched.
        4. ANCHOR SHAPE - no data-method/data-turbo-method other than GET, no data-confirm, no
           data-remote, no onclick, no download, no formaction, no role=button/menuitem, no
           aria-haspopup, and not inside an action menu.
      Ambiguity is a REFUSAL, never a pick: two matching rows, or two different identity-bound
      documents in one row, both refuse. After the fetch the landed URL is re-checked, so a redirect
      out of the observational route family fails closed. A forged, composed, lookalike or stale
      record is refused even when well-formed, and every successful fetch advances the observation
      context so a record cannot be replayed against a later document.
      NOTHING IN F2 IS REOPENED: no evaluate, no command, no click, no caller-authored JavaScript,
      no generic traversal method. The provenance observation (LOAD_ROW_LINKS_FN) is a VETTED READ
      SCRIPT like every other, taking the load identifier as protocol DATA.
      Edge counts are UNCHANGED at violations 2 / detection 14 - this is a correctness hardening of
      an already-cut entry point, not a new cut. Mutation battery 37/37 (B28, B28a-B28f, B30a).
      The click fallback was DELETED, not guarded - no structural test on an element (tag, type,
      label, selector, is_submit_target) can classify a SPA click as safe. A load whose detail page
      the list did not link to now stays POD-unknown, and an unknown POD blocks the money button:
      the safe degradation direction.
      ReadOnlyCdpObserver is UNTOUCHED. ReadOnlyCdpNavigator COMPOSES it rather than extending it,
      so F2's certified observation-only surface, its own channel and its mutation proofs all still
      stand, and a caller typed as an observer can never be a navigator.
    excluded_from_the_six_because: >-
      it WAS one of the six production-reachable live-write paths and is no longer one: its own
      browser surface is now read-only and imports no adapter, so this script initiates no external
      effect. The invoice WRITE it can still trigger does not belong to this path - it runs through
      the money-fenced OperationRouter, whose containment is EP-1's ADAPT conversion. EP-3 is
      therefore counted as cut here and the residual write risk is counted once, against EP-1,
      rather than twice.

