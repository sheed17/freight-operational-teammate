    superseded_p4_deferral: >-
      SUPERSEDED by the cut below; retained because it is the reasoning the cut had to answer.
      "DEFERRED at the P4 containment checkpoint. The clean cut is blocked here: BrowserUseWriteLedger
      is a TESTED capability whose canonical future is a boundary-routed write adapter (P12), so it
