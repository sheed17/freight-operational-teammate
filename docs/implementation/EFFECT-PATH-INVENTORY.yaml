      import_probe.ADAPTER_MODULES, import_probe.EFFECT_CAPABLE_ADAPTERS, entrypoint_probe and the
      frozen manifest, with no file behind it. And the move is a SWAP, not an addition: one
      intra-adapter composition edge replaced by another.
    p4_cut: >-
      DONE at P4 (U4.10). scripts/read_tms_browser_use.py imports only browser_use_adapter, and
      browser_use_adapter is no longer effect-capable, so the edge is ordinary detection residue
      rather than an unauthorized violation. Violation edges 2 -> 1; detection edges 14 -> 14.
      WHAT MOVED, and the correction the deferral had not anticipated: BrowserUseWriteLedger moved to
      browser_use_write AND SO DID NativeBrowserUseRunner. The runner executes an ARBITRARY
      natural-language task, so it is an actuation primitive in the same sense cdp_session.evaluate()
      is: whoever hands it a task decides what happens to the page. Leaving it in the read module
      would have produced read-only BY NAMING - the exact failure mode this disposition rejects, and
      one the repository's own guard already flagged (test_import_gate._LIVE_WRITE_DRIVERS listed
      BrowserUseTmsAdapter next to CdpActuator).
      WHY THE REMAINDER IS STRUCTURALLY READ-ONLY, on the F2 pattern:
        1. NO WRITE API EXISTS. No write_payable, get_payable, submit, enter_payable or generic run
           on BrowserUseTmsAdapter. A read caller cannot express a write.
        2. THE TASK IS NEVER CALLER-AUTHORED. A browser agent does what its TASK STRING says, so the
           task string is the primitive. ReadOnlyBrowserUseRunner.run_vetted takes a TASK ID from the
           frozen VETTED_READ_TASKS registry plus DATA, renders the task itself, and validates the
           load id against LOAD_ID_RE. There is no method that accepts a task string.
        3. THE MODULE IMPORTS NO EFFECT-CAPABLE ADAPTER, and does not import browser_use_write, so
           there is nothing to hand out and nothing to reach.
      BrowserUseWriteLedger is INTACT and retained for its documented P12 future. Deleting a
      legitimate future write capability to make a P4 gate green would be a false green.
      HONEST SCOPE - narrower than F2 on purpose: CDP containment is protocol-level (the channel
      allowlists CDP METHODS, so the browser never sees an actuation). A browser-use agent has no
      such chokepoint; it is an LLM driving a real browser and could in principle click inside a read
      task. What is MECHANICALLY true is that a read-side caller cannot express a write, cannot
      author the task, and cannot reach the write ledger or the generic runner. The residual belongs
      to the browser-agent execution class and is contained by the effect boundary at the point a
      write is ATTEMPTED. Evidence: eval/tests/test_browser_use_readonly_surface.py (structural,
      call-closure, behavioural, relocation) and boundary mutation cases B31-B35.
    excluded_from_the_six_because: >-
      it reads the MOCK TMS and initiates no write flow; it was UNLISTED in the frozen EP-1..13
      inventory (finding P0-F4) and is hereby adjudicated EP-14 rather than left unclassified.
      Its transitive actuator import keeps it in the R-07 containment scope.

