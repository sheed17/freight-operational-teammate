# ---------------------------------------------------------------------------------------------
# THE ADJUDICATED CONTRACT (interpretation C — HYBRID). Producer identity is table membership;
# completeness is the presence of a durable write. Neither predicate reads prose.
contract:
  ruling: >-
    INTERPRETATION C - HYBRID. The producer predicate is MEMBERSHIP IN A TABLE
    (events/registry.md sec 3) and the completeness predicate is THE PRESENCE OF A DURABLE WRITE
    (GR-2). Interpretation A (every row must name an event) is refuted mechanically: it
    misclassifies the 11 correct co-transition/causation rows and would require inflating the
    frozen 98-event registry. Interpretation B (explicitly documented non-producing) is refused
    because its predicate is PROSE-DEPENDENT AND SELF-CERTIFYING - CF-7 and EC-7 both exempted
    themselves with "(no state change)" while performing durable writes.

  producer_transition: >-
    Transition T is a producer transition of event E IFF T appears in E's producer-transition
    field in docs/specifications/events/registry.md sec 3. Section 3 is the SOLE authority for
    this relation. A machine table's Event column is NOT the producer map - it carries both
    events the row produces and events the row co-transitions with, causes or reflects.

  gr2_durable_write: >-
    GR-2 (state-machines/registry.md sec 3) - "the state change + emitted events are ONE commit;
    no state change without its event; no event without its transition." A row performs a DURABLE
    WRITE iff (a) its From -> To names a canonical state on the To side that is not in its From
    set (registry sec 4), OR (b) its Writes / Prov column is non-empty and not an em-dash.

  classification_vocabulary:
    # A row is classified by sec-3 membership FIRST. Every row that is not a sec-3 producer MUST
    # carry exactly one structured token in its Event cell, drawn from this closed set. Prose is
    # never a classifier. A row the classifier cannot decide is a BUILD FAILURE - never a pass and
    # never a skip.
    PRODUCER: >-
      T appears in sec 3's producer-transition field for at least one canonical event. Carries no
      token; the token would be redundant with the authority that decides it.
    CONSUMES: >-
      "CONSUMES:<EventName>[,<EventName>]" - the row co-transitions with, or is caused by, an
      event whose sec-3 producer is a DIFFERENT transition. The durable change this row makes is
      recorded by that event, emitted in the same commit by its owner (registry sec 182: "no event
      is emitted by two incompatible transitions ... the other machine consumes it"). Every named
      event must exist in the canonical corpus and T must NOT be its sec-3 producer.
    NON_PRODUCING: >-
      "NON_PRODUCING:<REASON_CODE>" from the closed set below. Legal only when the row performs
      ZERO durable writes. A NON_PRODUCING row that declares a durable write FAILS THE BUILD.
    DELEGATES_TO: >-
      "DELEGATES_TO:<TO_STATE>=<id>[,<id>][;<TO_STATE>=<id>...]" - ownership resolved by TARGET
      STATE, never positionally. Every target must exist in the corpus, be a sec-3 producer, and
      have the declared state in its own To set; every declared state must resolve to EXACTLY ONE
      canonical event (zero owners and ambiguous ownership both FAIL); and the union of declared
      states must equal the row's own To set exactly.
    EVENT_REQUIRED: >-
      "EVENT_REQUIRED:<OBLIGATION_ID>" - the row performs a durable write, GR-2 therefore requires
      an event, and the canonical event NAME is undecided founder/architect design authority. The
      obligation id must be registered in `founder_gated_event_obligations`, must not be an
      event-shaped name, and must not appear in the canonical event corpus. This is a RECORDED,
      OPEN VIOLATION - not an exemption.

  non_producing_reason_codes:
    ENUMERATED_NO_OP: >-
      an enumerated same-state row with zero writes, whose architectural purpose is to make a
      (state, trigger) pair legal-and-inert so GR-1 does not raise IllegalTransitionAttempted.
    GR1_ILLEGAL_REFUSAL: >-
      an enumerated ILLEGAL refusal row. GR-1 attaches IllegalTransitionAttempted to EVERY illegal
      pair through the rule itself, and such a row persists nothing, so it satisfies the
      zero-durable-write test inherently.

  zero_owner_prohibition: >-
    Every canonical event in sec 3 must have at least one producer transition that exists in the
    134-row corpus. An event with no resolvable producer FAILS THE BUILD.

  duplicate_owner_prohibition: >-
    Each canonical event is declared exactly once in sec 3; a name declared twice FAILS THE BUILD.
    A non-coordination event's producer transitions must all belong to ONE machine (registry
    sec 182). Only the declared coordination events (marked with the double-dagger) may span
    machines: RealityEstablished, ConflictRaised, PolicyVersionChanged, IllegalTransitionAttempted.

  traceability: >-
    The sec-3 producer map and the 134-row corpus are asserted bijective in BOTH directions by
    exact set equality (G2-D11): every declared producer id exists as a corpus row, and every
    corpus row is either a declared producer or carries exactly one structured classification
    token. Every sec-3 producer row must additionally name at least one canonical event in its
    Event cell, so a producer cannot go silent in the specification it is derived from.

  fail_closed: >-
    Unknown or unclassified event responsibility is a BUILD FAILURE. It may never silently PASS or
    SKIP. Malformed classification (an unknown class token, an unknown reason code, a delegation
    that resolves to zero or several owners, a NON_PRODUCING row with a durable write, an
    unregistered obligation id, a row whose cell count differs from its header count) is a BUILD
    FAILURE.

  no_prose_self_certification: >-
    No classifier reads narrative prose. "no new event", "no state change", "as those",
    "(Exception raised)" and "respectively" are NOT classification syntax and carry no weight.

