          RESOLVED_BY_RULE: {targets: [CF-3], owner_event: ConflictResolved}
          RESOLVED_BY_HUMAN: {targets: [CF-4], owner_event: ConflictResolved}
        duplicate_risk: >-
          none. CF-6 fires INSTEAD of CF-3/CF-4, from a different From state (ESCALATED).

  - name: EVENT_REQUIRED
    meaning: >-
      a durable write with no canonical event recording it. GR-2 is VIOLATED by each of these rows
      as written. They are recorded open, not exempted. See founder_gated_event_obligations.
    members:
      - 02-pipeline-instance:PL-7a
      - 04-approval:AP-9
      - 07-conflict:CF-7
      - 09-exception:EC-7
      - 11-policy:PO-2
      - 11-policy:PO-3
      - 12-rule:RU-8

  - name: CONSUMES
    meaning: >-
      the row co-transitions with, or is caused by, an event owned by a different transition on a
      DIFFERENT machine, under a relationship PROVEN by consumes_valid above from structured columns
      only. Eight are durable-writing co-transition mirrors whose relationship discharges GR-2; one
      (RU-3) performs zero durable writes, so GR-2 does not bind it and its marker exempts nothing.
    membership_derivation: >-
      NOT copied from the rejected candidate's list of eleven. Re-derived: of the eleven, PL-15x and
      IB-5x fail consumes_valid rule 3 (their event's producer is the rule GR-1, not a transition) and
      are NON_PRODUCING above. The nine below each satisfy the contract in full, and `owner`,
      `owner_machine` and `durable_write` are RECOMPUTED and asserted against this record on every run.
    members:
      - key: 02-pipeline-instance:PL-6
        consumes: [ApprovalRequested]
        owner: [AP-1]
        owner_machine: [M4]
        durable_write: true
        relationship: >-
          M2<->M4. PL-6 moves the pipeline to AWAITING_APPROVAL in the same commit in which M4's AP-1
          creates the approval request. Co-commit declared in both rows (PL-6 -> M4 `REQUESTED`;
          AP-1 -> M2 `AWAITING_APPROVAL`). Cross-machine, not mutually exclusive. Persists no field of
          its own, so 5d is satisfied with nothing to cover; the state itself is reconstructible from
          PolicyEvaluated{gate_decision} plus PL-6's own deterministic guard.
      - key: 02-pipeline-instance:PL-9
        consumes: [GrantClaimed]
        owner: [EF-2]
        owner_machine: [M3]
        durable_write: true
        relationship: >-
          ### THE PARADIGM CASE, and the only row that already satisfied 5a at the certified
          predecessor. M2<->M3: the claim CAS. PL-9 declares "co-commit: M3 `CLAIMED` + M4
          `ApprovalConsumed` + `EffectAttempted`"; EF-2 declares "co-commit M2 `CLAIMED`, M4
          `CONSUMED`". Neither row may be in CLAIMED without the other (M2 sec 4, the M2<->M3
          co-transition rule).
      - key: 02-pipeline-instance:PL-10
        consumes: [EffectExecuted]
        owner: [EF-3]
        owner_machine: [M3]
        durable_write: true
        relationship: >-
          M2<->M3 mirror of the adapter return. Co-commit declared both ways (PL-10 -> M3 `ATTEMPTED`;
          EF-3 -> M2 `EXECUTED`). Its Writes cell is the PROSE "ext: the world was touched", which
          declares NO field - so 5d has nothing to cover, and prose cannot smuggle one in.
      - key: 02-pipeline-instance:PL-10f
        consumes: [EffectFailed]
        owner: [EF-3f]
        owner_machine: [M3]
        durable_write: true
        relationship: >-
          Exact mirror: EF-3f is `CLAIMED`->`FAILED` and writes failure_proof, as PL-10f does.
          Co-commit declared both ways. 5d: failure_proof is carried by EffectFailed's sec-5 payload.
      - key: 02-pipeline-instance:PL-10u
        consumes: [OutcomeUnknown]
        owner: [EF-3u, EF-4c, EF-4u]
        owner_machine: [M3]
        durable_write: true
        relationship: >-
          Mirror of EF-3u (`CLAIMED`->`UNKNOWN_OUTCOME`). OutcomeUnknown is declared in sec 3 with
          THREE producers (EF-3u/EF-4c/EF-4u); 5a-5c are required of EVERY one of them, and all three
          are M3 rows that now declare the reciprocal co-commit with M2. 5d: exposure and
          unknown_reason are both carried by OutcomeUnknown's sec-5 payload.
        precision_residual: >-
          the declared owner set is BROADER than the single causal path (EF-3u). The adjudication
          recorded this as precision owed, not a defect: the contract is satisfied for all three
          owners, so no member is admitted on a weaker basis than any other. Narrowing sec 3's
          producer list is a producer-map change and is not available to this unit.
      - key: 02-pipeline-instance:PL-11
        consumes: [EffectVerified]
        owner: [EF-4]
        owner_machine: [M3]
        durable_write: true
        relationship: >-
          M2<->M3 verification mirror. EF-4 already declared a co-commit ("verify+record one txn",
          with PL-12); this unit added the machine token so the declaration names M2 explicitly, and
          PL-11 declares M3 `VERIFIED`. Persists no field of its own.
      - key: 02-pipeline-instance:PL-11c
        consumes: [VerificationConflict, VerificationUnavailable]
        owner: [EF-4c, EF-4u]
        owner_machine: [M3]
        durable_write: true
        relationship: >-
          Exact mirrors: EF-4c writes unknown_reason=OBSERVATION_CONFLICTING and EF-4u
          unknown_reason=OBSERVATION_UNAVAILABLE. Co-commit declared in all three rows, and now
          ROW-BOUND: PL-11c declares M3 `UNKNOWN_OUTCOME`, which is exactly the state EF-4c and
          EF-4u enter, and each of them declares M2 `NEEDS_VERIFICATION`, exactly the state PL-11c
          enters. 5d: unknown_reason is carried by both events' sec-5 payload.
        precision_residual: >-
          ### THE ONE EXPLOIT THE ROW BINDING DOES NOT CLOSE, CARRIED DELIBERATELY. PL-11c also
          ACCEPTS OutcomeUnknown, which it does not declare. OutcomeUnknown's sec-3 producers are
          EF-3u/EF-4c/EF-4u; EF-4c and EF-4u ARE PL-11c's genuine partners, and only EF-3u is
          causally wrong - it passes because all three declare M2 `NEEDS_VERIFICATION` while both
          PL-10u and PL-11c target NEEDS_VERIFICATION, so the (machine, To-state) key is not
          injective when two rows on one machine share a target state. ### ITS ROOT IS
          events/registry.md sec 3's three-producer list, a FROZEN AND FORBIDDEN SURFACE for this
          unit, and all three candidate closures were considered and REFUSED - one of them
          (injectivity) VERIFIED TO OVER-REJECT legitimate rows. Measured against sec 3 as frozen
