          consumes_relation_matrix.carried_residuals; NOT claimed closed. Sibling of PL-10u's
          owner-set-breadth residual, which has the same root.
      - key: 02-pipeline-instance:PL-15
        consumes: [RealityEstablished]
        owner: [EF-5, CM-5]
        owner_machine: [M3, M10]
        durable_write: true
        relationship: >-
          RealityEstablished is a declared coordination event with two structurally-identical
          producers, so 5a-5c are proven against BOTH: PL-15 declares co-commit with M3
          `{VERIFIED,FAILED}` AND M10 `COMPLETED`, and EF-5 and CM-5 each declare the reciprocal with
          M2. 5d: decision_ref is carried by RealityEstablished's sec-5 payload (decision_ref,
          outcome).
        precision_residual: >-
          PL-15's To set has two members and is resolved at runtime by the event's own `outcome`
          field, which makes the row DELEGATION-SHAPED. The adjudication noted it owes the same
          exactly-one-owner-per-branch proof DELEGATES_TO carries. That invariant is NOT imposed here,
          because the adjudicated CONSUMES-VALID contract does not require it and imposing it would
          reject CM-5, a row the same adjudication ruled a valid owner. Recorded as owed precision.
      - key: 12-rule:RU-3
        consumes: [ConflictRaised]
        owner: [CF-1, IB-6, EF-4c]
        owner_machine: [M3, M6, M7]
        durable_write: false
        relationship: >-
          ### CAUSATION, NOT CO-TRANSITION, AND ZERO DURABLE WRITE. RU-3's To side is "*(blocked)*",
          which names no canonical state, and its Writes cell is an em-dash - so GR-2 DOES NOT BIND
          IT and rules 5a-5d are not required (consumes_valid rule 4). ### ITS MARKER THEREFORE
          EXEMPTS NOTHING; it documents that a rule-vs-rule disagreement raises M7's own fact. M7's
          conflict is an independent domain fact, which is why RU-3 is not itself a producer.
        related_residual: G2-D9

