# ---------------------------------------------------------------------------------------------
# THE ADJUDICATED CONTRACT (interpretation C — HYBRID). Producer identity is table membership;
# completeness is the presence of a durable write. Neither predicate reads prose.
contract:
  ruling: >-
    INTERPRETATION C - HYBRID. The producer predicate is MEMBERSHIP IN A TABLE
    (events/registry.md sec 3) and the completeness predicate is THE PRESENCE OF A DURABLE WRITE
    (GR-2). Interpretation A (every row must name an event) is refuted mechanically: it
    misclassifies the 11 correct co-transition/causation rows and would require inflating the
    event registry wholesale (the ruling said "the frozen 98"; the total is now 105, and the
    objection is unchanged in kind - interpretation A would require an event for EVERY row, not seven). Interpretation B (explicitly documented non-producing) is refused
    because its predicate is PROSE-DEPENDENT AND SELF-CERTIFYING - CF-7 and EC-7 both exempted
    themselves with "(no state change)" while performing durable writes.

  producer_transition: >-
    Transition T is a producer transition of event E IFF T appears in E's producer-transition
    field in docs/specifications/events/registry.md sec 3. Section 3 is the SOLE authority for
    this relation. A machine table's Event column is NOT the producer map - it carries both
    events the row produces and events the row co-transitions with, causes or reflects.

  gr2_durable_write: >-
    GR-2 (state-machines/registry.md sec 3) - "the state change + emitted events are ONE commit;
    no state change without its event; no event without its transition." A row performs a DURABLE
    WRITE iff (a) its From -> To names a canonical state on the To side that is not in its From
    set (registry sec 4), OR (b) its Writes / Prov column is non-empty and not an em-dash.

  classification_vocabulary:
    # A row is classified by sec-3 membership FIRST. Every row that is not a sec-3 producer MUST
    # carry exactly one structured token in its Event cell, drawn from this closed set. Prose is
    # never a classifier. A row the classifier cannot decide is a BUILD FAILURE - never a pass and
    # never a skip.
    PRODUCER: >-
      T appears in sec 3's producer-transition field for at least one canonical event. Carries no
      token; the token would be redundant with the authority that decides it.
    CONSUMES: >-
      "CONSUMES:<EventName>[,<EventName>]" - the row co-transitions with, or is caused by, an event
      whose sec-3 producer is a DIFFERENT transition
      (docs/specifications/state-machines/registry.md sec 5, line 182: "no event is emitted by two
      incompatible transitions ... the other machine consumes it").
      ### THE TOKEN IS A CLAIM, NOT A PROOF, AND IT CARRIES NO EXEMPTING FORCE OF ITS OWN. What this
      class asserts is exactly what `consumes_valid` below MECHANICALLY PROVES and no more. A
      durable-writing consumer discharges GR-2 only when the co-transition relationship is proven
      from structured columns; a row that cannot be decided FAILS THE BUILD. A zero-durable-write
      consumer is DESCRIPTIVE only - GR-2 does not bind it, so its marker exempts nothing.
    NON_PRODUCING: >-
      "NON_PRODUCING:<REASON_CODE>" from the closed set below. Legal only when the row performs
      ZERO durable writes. A NON_PRODUCING row that declares a durable write FAILS THE BUILD.
    DELEGATES_TO: >-
      "DELEGATES_TO:<TO_STATE>=<id>[,<id>][;<TO_STATE>=<id>...]" - ownership resolved by TARGET
      STATE, never positionally. Every target must exist in the corpus, be a sec-3 producer, and
      have the declared state in its own To set; every declared state must resolve to EXACTLY ONE
      canonical event (zero owners and ambiguous ownership both FAIL); and the union of declared
      states must equal the row's own To set exactly.
    EVENT_REQUIRED: >-
      "EVENT_REQUIRED:<OBLIGATION_ID>" - the row performs a durable write, GR-2 therefore requires
      an event, and the canonical event NAME is undecided founder/architect design authority. The
      obligation id must be registered in `founder_gated_event_obligations`, must not be an
      event-shaped name, and must not appear in the canonical event corpus. This is a RECORDED,
      OPEN VIOLATION - not an exemption.

  non_producing_reason_codes:
    ENUMERATED_NO_OP: >-
      an enumerated same-state row with zero writes, whose architectural purpose is to make a
      (state, trigger) pair legal-and-inert so GR-1 does not raise IllegalTransitionAttempted.
    GR1_ILLEGAL_REFUSAL: >-
      an enumerated ILLEGAL refusal row. GR-1 attaches IllegalTransitionAttempted to EVERY illegal
      pair through the rule itself, and such a row persists nothing, so it satisfies the
      zero-durable-write test inherently.

  # -------------------------------------------------------------------------------------------
  # CONSUMES-VALID. The contract the targeted governance adjudication of candidate 38b4bda
  # REQUIRED, after ruling that the first attempt at this class was SELF-CERTIFYING.
  #
  # ### WHAT WENT WRONG, RECORDED SO IT CANNOT RECUR QUIETLY. The rejected candidate's guard proved
  # ### only that the named event EXISTED and that the row did not OWN it. It proved no
  # ### relationship of any kind. So 04-approval:AP-9 - the highest-severity open GR-2 obligation
  # ### in this corpus - could be relabelled CONSUMES:ApprovalConsumed (owner AP-7, MUTUALLY
  # ### EXCLUSIVE with it) and the suite stayed green; and it could be relabelled
  # ### CONSUMES:BrakeReleased, an M13 brake event with no machine, aggregate, family, causal or
  # ### temporal relationship whatsoever to an M4 approval freeze, and the suite STILL stayed green.
  # ### The class admitted ANY of the 98 canonical events. That is the CF-7 prose failure recommitted
  # ### in structured syntax: a document certifying a safety property about itself that nothing
  # ### checked.
  #
  # The relationship itself was never in doubt and was never invented here - it pre-exists in
  # byte-unchanged authority, and the adjudication RATIFIED the architecture. What is added is the
  # PROOF. Enforced by
  # test_bootstrap_hermeticity.py::test_consuming_rows_prove_an_authoritative_co_transition_relationship
  # and consumed by the GR-2 converse guard, which now refuses to treat an unproven CONSUMES row as
  # discharging anything.
  consumes_valid:
    authority:
      co_transition_rule: >-
        docs/specifications/state-machines/registry.md sec 5, line 182 - "No event is emitted by two
        incompatible transitions. Where two machines co-transition (M2<->M3, M2<->M4), the event has
        ONE PRODUCER (listed above) and the other machine CONSUMES it." BYTE-UNCHANGED by this unit.
      shared_moment_rule: >-
        docs/specifications/state-machines/registry.md sec 4, line 125 - GRANTED and CLAIMED are
        "the same conceptual event surfaced on the two machines that share the moment ... they are
        co-transitioned, not two meanings". BYTE-UNCHANGED by this unit.
      consumer_guard_rule: >-
        docs/specifications/events/registry.md line 7 - "Consumers react according to THEIR OWN
        deterministic transition guards; the event does not instruct them." This is why 4(d) requires
        payload COVERAGE of the persisted fields and NOT that the payload encode the consumer's
        resulting state - encoding it would make the event a command.
      machine_source_of_truth: >-
        THE `Writes` COLUMN'S `co-commit` DECLARATIONS, required in BOTH rows. This is structured
        data that already existed: at the certified predecessor EF-2 carried
        "`claimed_at`; co-commit M2 `CLAIMED`, M4 `CONSUMED`" and PL-9 the reciprocal. This unit added
        the same cell content to the seven under-declared durable consumers and their owner rows. It
        MINTED NO EVENT and did not touch the 98-event total THEN IN FORCE. (The seven events minted
        on 2026-08-12 are a SEPARATE, later, founder/architect act; they added no CONSUMES member and
        changed no co-commit declaration.)
      prose_is_never_a_predicate: >-
        ### The narrative "## M2<->M3 co-transition rule" sections in the machine files may NEVER be
        the predicate, in any class. A narrative section is exactly what the G2 adjudication sec F
        refused when it rejected interpretation B.
    rules:
      "1_event_exists": every named event exists in the sec-3 canonical corpus.
      "2_not_self_owned": T is not itself the sec-3 producer of that event.
      "3_owner_is_a_transition": >-
        the event's sec-3 producer(s) must ALL resolve to rows of the 134-row corpus. An event whose
        producer is a RULE rather than a transition - IllegalTransitionAttempted, owned by GR-1 -
        offers no transition to co-commit with and therefore CANNOT BE CONSUMED. This is the
        mechanical reason 02-pipeline-instance:PL-15x and 06-identity-binding-claim:IB-5x are
        NON_PRODUCING and not CONSUMES, exactly as G2 sec H step 7 ruled.
      "4_zero_write_is_descriptive_only": >-
        if T performs NO durable write, GR-2 does not bind it. The marker is DESCRIPTIVE and carries
        NO EXEMPTING FORCE. 12-rule:RU-3 is the only such row.
      "5a_co_commit_declared_bidirectionally_and_row_bound": >-
        ### THE ORDERED PAIR (MACHINE, TARGET STATE), REQUIRED IN BOTH ROWS' co-commit segments.
        FORWARD: there is a state s in To(owner) such that (M(owner), s) is declared by T. REVERSE:
        there is a state s in To(T) such that (M(T), s) is declared by the OWNER ROW ITSELF. Both
        directions, or FAIL. ### THE MACHINE INTEGER ALONE IS NOT ENOUGH AND THAT IS THE WHOLE
        FINDING: replacement candidate 1ae365a compared machine numbers and discarded the state
        token beside them, which POOLED EVERY DECLARATION ACROSS A WHOLE MACHINE - so every row on
        machine M inherited every declaration any row on M's partner machine ever wrote. Measured
        cost: 23 false-accepting (consumer, event) pairs across the 8 durable consumers. The state
        token was always present in all twenty declarations in the corpus; it was simply not read.
        ### THE REVERSE LEG IS THE NON-CIRCULAR ONE - the owner's declaration IS AUTHORED ON A
        DIFFERENT ROW OF A DIFFERENT MACHINE, written for that row's own purpose, so a candidate row
        can no longer prove its own exemption with a token it added to its own cell.
        ### CORRECTED (R2-A). An earlier version of this sentence also claimed the reverse leg
        "PRE-EXISTS the claim". THAT WAS FALSE OF THIS CORPUS AND IS STRUCK. Rows carrying `co-commit`
        declarations went from 5 at the certified parent 6e8127d to 20 at d59b740: FIFTEEN reverse legs
        were authored by the SAME COMMIT whose CONSUMES claims they justify. What the guard actually
        proves is DIFFERENT-ROW authorship, not temporal precedence, and this file now says only that.
        The non-circularity that survives is real and is the one the guard rests on: a row cannot
        satisfy the reverse leg by editing its OWN cell. It is NOT a proof that the counterpart cell
        predates the claim, and nothing here may be read as one. Widening this into a redesign of
        CONSUMES-VALID (for instance requiring provenance or a commit identity on the declaration) is
        OUT OF SCOPE and was not done.
      "5a_undecidable_is_a_failure": >-
        if either row names no canonical To state, or declares the machine at issue with NO
        canonical state beside it, the relationship is UNDECIDABLE and the build FAILS (rule 7).
        02-pipeline-instance:PL-9's "M4 `ApprovalConsumed`" leg is exactly that shape - an event
        name where a state belongs. It is never exercised today, because no owner of a PL-9-consumed
        event lives on M4, and it fails closed if one ever does rather than being read as a bare
        machine. Normalising that leg to the state `CONSUMED` was offered as OPTIONAL and is NOT
        taken here: it is a specification edit this remediation does not need.
      "5b_not_mutually_exclusive": >-
        ### THE DECISIVE MISSING INVARIANT. The owner and T must not be rows of the same machine
        whose From sets intersect and whose To states differ. If the owner's transition did not fire,
        its event was never emitted, so it can record NOTHING. AP-9 (GRANTED->GRANTED frozen) and
        AP-7 (GRANTED->CONSUMED) cannot both fire on one approval.
      "5c_cross_machine": >-
        T's machine is not the owner's machine. A within-machine "consumption" is either production
        or delegation.
      "5d_replay_coverage": >-
        every field T declares it persists appears in a consumed event's sec-5 payload, so a
        full-history replay can reconstruct the write (AC-EVT-008). Fields are read only from
        STRUCTURED forms - a backticked declaration or a name=value assignment. PROSE IN A Writes
        CELL DECLARES NO FIELD, so a field name cannot be smuggled in inside a sentence.
      "6_downgrade_prohibition": >-
        EVENT_REQUIRED -> CONSUMES requires 5a-5d in full. NON_PRODUCING -> CONSUMES requires the row
        first acquire a durable write AND satisfy them.
      "7_fail_closed": >-
        ### any CONSUMES row for which the relationship cannot be DECIDED FAILS THE BUILD. Never a
        pass, never a skip.
    insufficient_by_themselves: >-
      ### RULED INSUFFICIENT BY NAME, so none of these may ever become the predicate: that the event
      exists; that the consumer does not own it; that the event FAMILY matches; that the TARGET STATE
      matches; that the names resemble each other; that the producer is merely "another transition";
      that the aggregate class counts stay constant. Set equality between the specification and this
      file proves the two AGREE - it proves nothing about whether either is TRUE.
    target_state_prohibition_does_not_bar_the_row_binding: >-
      ### RULED EXPLICITLY, because the two are easy to confuse. "That the TARGET STATE matches" is
      barred as a SUBSTITUTE for the co-transition relation - bare target-state similarity is the
      DELEGATES_TO predicate, not this one. Rule 5a does something different: it makes the EXISTING
      bidirectional co-commit DECLARATION row-specific by reading the state the declaration itself
      carries. It is a CONJUNCT ADDED TO 5a, never a disjunct replacing it, and 5b, 5c and 5d all
      remain required in full. A future remediation that weakens or drops any of them in exchange
      for the state binding is OUT OF CONTRACT.
    refused_as_architecture_invention: >-
      ### These were considered for the relationship key and REFUSED, so none may be added without
      its own authorization: a producer/consumer TRANSITION ID inside the declaration (no
      declaration carries one); the SOURCE (`From`) state (likewise); a canonical EVENT NAME inside
      the declaration (PL-9's M4 leg is the corpus's only event-named leg and is a data
      irregularity, not a convention); a COMMIT/CAUSATION identity (causation_id is a runtime
      carrier, and the declared co-commit is the specification-level artifact); and a NEW COLUMN in
      the transition tables. ### The key uses only data the twenty existing declarations already
      carry: no specification data changed, and no event was minted.

  zero_owner_prohibition: >-
    Every canonical event in sec 3 must have at least one producer transition that exists in the
    134-row corpus. An event with no resolvable producer FAILS THE BUILD.

  duplicate_owner_prohibition: >-
    Each canonical event is declared exactly once in sec 3; a name declared twice FAILS THE BUILD.
    A non-coordination event's producer transitions must all belong to ONE machine
    (state-machines/registry.md sec 5, line 182). Only the declared coordination events (marked with
    the double-dagger) may span machines: RealityEstablished, ConflictRaised, PolicyVersionChanged,
    IllegalTransitionAttempted.

  traceability: >-
    The sec-3 producer map and the 134-row corpus are asserted bijective in BOTH directions by
    exact set equality (G2-D11): every declared producer id exists as a corpus row, and every
    corpus row is either a declared producer or carries exactly one structured classification
    token. Every sec-3 producer row must additionally name at least one canonical event in its
    Event cell, so a producer cannot go silent in the specification it is derived from.

  fail_closed: >-
    Unknown or unclassified event responsibility is a BUILD FAILURE. It may never silently PASS or
    SKIP. Malformed classification (an unknown class token, an unknown reason code, a delegation
    that resolves to zero or several owners, a NON_PRODUCING row with a durable write, an
    unregistered obligation id, a row whose cell count differs from its header count) is a BUILD
    FAILURE.

  no_prose_self_certification: >-
    No classifier reads narrative prose. "no new event", "no state change", "as those",
    "(Exception raised)" and "respectively" are NOT classification syntax and carry no weight.

# ---------------------------------------------------------------------------------------------
# WHAT THE CORPUS COMPUTES NOW. Recomputed on every run; exact members below.
computed_classification:
  PRODUCER: 117
  CONSUMES: 9
  NON_PRODUCING: 6
  DELEGATES_TO: 2
  EVENT_REQUIRED: 0
  # 117 + 9 + 6 + 2 + 0 = 134
  #
  # ### THE MOVE FROM 110/7 TO 117/0 IS THE SEVEN MINTED EVENTS AND NOTHING ELSE. Each of the seven
  # rows became a sec-3 PRODUCER because sec 3 now declares it the producer of a canonical event; not
  # one of them was reclassified into CONSUMES, DELEGATES_TO or NON_PRODUCING, and those three classes
  # are byte-identical in membership to the certified predecessor. EVENT_REQUIRED is now EMPTY, which
  # is a CONSEQUENCE of seven re-proven discharges, never a target: the class is still asserted by
  # exact set equality against the frozen adjudicated seven, and a member that left without a
  # mechanically re-proven discharge still fails the build.
  #
  # ### THE NUMBER 11 IS NOT PRESERVED, AND THAT IS THE POINT. The targeted adjudication of candidate
  # 38b4bda corrected the class membership: PL-15x and IB-5x were classified CONSUMES against G2
  # sec H step 7's explicit ruling that their naming IllegalTransitionAttempted inline is "redundant
  # documentation, not a different contract". Both are zero-durable-write GR-1 refusal rows,
  # structurally identical to EF-5x / CM-5x / BR-5, and they are now classified with them. The count
  # is a CONSEQUENCE of the corrected membership, never the target: every class is asserted by EXACT
  # SET EQUALITY, and the semantic relational guards fail even when these five totals are held
  # constant.

producer_view:
  producer_transitions: 117
  non_producer_transitions: 17
  # NOTE (G2-D7): the non-producer count was 24 until the 2026-08-12 mint and is now 17. The COLLISION
