frozen_event_required_set:
  record_id: G2-U51-EVENT-REQUIRED-SET-SEVEN
  adjudication: >-
    NEYMA P5 U5.1 - replacement candidate 1ae365a, separate targeted governance re-adjudication,
    sec I.3 ("An explicit guard MUST bind the exact EVENT_REQUIRED SET, not merely its count").
  adjudication_digest: 30eddf57c7e44f442258b94e592f209f2932dbeca9812eb4c22b3b6a36e39ed9
  recorded_on: "2026-08-08"
  members:
