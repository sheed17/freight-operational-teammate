# RECORDED, NOT DISCHARGED. Carried out of the G2 adjudication and out of this unit.
recorded_residuals:

  - id: G2-D4
    surface: spec / schema
    status: OPEN - RECORDED, NOT FIXED
    statement: >-
      events/registry.md sec 3 does not list WI-14 or CF-6 in the producer lists of the events they
      delegate (WorkBlocked (WI-5/6), ConflictResolved (CF-3/4)). If a delegated emission carried
      producer_transition_id = WI-14 or CF-6 the sec-3 map would be incomplete and the bijection
      guard would fail.
    admissible_remedies:
      - "extend the sec-3 producer lists to include the delegating rows; or"
      - "define delegated emissions to carry the TARGET row's transition id."
    why_not_fixed_here: >-
      Both remedies are decisions about the producer map or the event envelope's semantics. The
      DELEGATES_TO guard resolves EVENT OWNERSHIP without needing either, so this unit resolved the
      mechanical question and left the schema decision open rather than improvising it.

  - id: G2-D6
    surface: spec (+ corpus)
    status: OPEN - RECORDED, NOT FIXED
    statement: >-
      `VerificationDeferred` is declared in F3 with producer PL-11d, which is an M2 row, while
      state-machines/registry.md sec 5 declares its producer to be M3 - and M3 has NO corresponding
      transition row at all.
    why_not_fixed_here: >-
      Discharging it requires ADDING A TRANSITION to M3, which changes the 134-row corpus. That is
      outside a bounded specification/control correction and outside this unit's authority.

  - id: G2-D8
    surface: schema
    status: OPEN - RECORDED, NOT FIXED
    statement: >-
      producer_transition_id is required-always in the canonical envelope (events/registry.md
      sec 1) but is undefined for IllegalTransitionAttempted, whose declared producer is the RULE
      GR-1, not a transition. A required field with no defined value is a schema gap.
    fail_closed_default_proposed_by_the_adjudication: >-
      a reserved non-transition sentinel plus the payload's machine/state/trigger.
    why_not_fixed_here: >-
      Defining the sentinel is event-schema content, which remains blocked on the same
      founder/architect gate as the seven obligations above.

  - id: G2-D9
    surface: spec
    status: OPEN - RECORDED, NOT FIXED
    statement: >-
      12-rule:RU-3 causes M7's ConflictRaised (RULE_VS_RULE) but sec 3's coordination producer list
      for ConflictRaised is (CF-1/IB-6/EF-4c) and omits RU-3.
    why_not_fixed_here: >-
      Adding RU-3 to a coordination event's producer list changes the producer map (110 -> 111) and
      the coordination architecture's membership. RU-3 performs zero durable writes, so GR-2 does
      not bind it, and it is classified CONSUMES here. Whether it should instead be a declared
      coordination producer is a coordination-architecture decision, not a parser correction.

  - id: G2-D10
    surface: spec
    status: OPEN - RECORDED, NOT FIXED
    statement: >-
      specifications/acceptance/foundational-machine-acceptance.md calls all 134 "the 134 LEGAL
      transitions" while five of them (EF-5x, CM-5x, BR-5, PL-15x, IB-5x) are explicitly ILLEGAL
      refusal rows.
    why_not_fixed_here: >-
      foundational-machine-acceptance.md is an acceptance-specification surface outside the
      canonical-document set this unit was scoped to correct, and it is read by
      eval/phase0 declared-total guards.

  - id: G2-D7
    surface: test/control
    status: CLOSED BY THIS UNIT
    statement: >-
      the anti-"24" control-document guard would have failed on the TRUE sentence "24 of the 134
      transitions are not producer transitions", because the retired figure and the computed
      non-producer count share a value.
    how_closed: >-
      the guard gained a carve-out that distinguishes the RETIRED count of unnamed transitions from
      the COMPUTED count of non-producer transitions, and a companion guard now forbids reviving
      the retired 121/13 split as the current finding. Contorting the phrasing to dodge the guard
      would have been evidence-hiding and was refused.
