# EXACT MEMBERSHIP. Asserted by set equality against a fresh computation - a same-count
# substitution fails.
classes:

  - name: NON_PRODUCING
    meaning: zero durable writes, explicitly classified; proven, never self-declared in prose
    members:
      - key: 04-approval:AP-8
        reason_code: ENUMERATED_NO_OP
        proof: "GRANTED -> GRANTED (same state); Writes = em-dash"
        purpose: >-
          makes the pair (GRANTED, AttemptFailedProvably) enumerated and inert so GR-1 does not
          raise IllegalTransitionAttempted when an approval correctly survives a provably-failed
          attempt (M4 sec 20).
      - key: 03-external-effect-grant:EF-5x
        reason_code: GR1_ILLEGAL_REFUSAL
        proof: "no To state; Writes = em-dash"
      - key: 10-compensation:CM-5x
        reason_code: GR1_ILLEGAL_REFUSAL
        proof: "no To state; Writes = em-dash"
      - key: 13-brake:BR-5
        reason_code: GR1_ILLEGAL_REFUSAL
        proof: "no To state; Writes = em-dash"

  - name: DELEGATES_TO
    meaning: the event is owned elsewhere; ownership resolved by target state, never positionally
    members:
      - key: 01-work-item:WI-14
        from_to: "ESCALATED -> {BLOCKED,AWAITING_HUMAN,CLOSED,CANCELLED}"
        resolution:
          BLOCKED: {targets: [WI-5, WI-6], owner_event: WorkBlocked}
          AWAITING_HUMAN: {targets: [WI-7], owner_event: HumanRequested}
          CLOSED: {targets: [WI-3], owner_event: WorkItemClosed}
          CANCELLED: {targets: [WI-12], owner_event: WorkItemCancelled}
        arity_note: >-
          G2-D3. The row referenced five transitions against four target states, so the word
          "respectively" could not decide it - WI-5 and WI-6 BOTH target BLOCKED. Target-state
          matching decides it exactly: the BLOCKED branch resolves to the single event WorkBlocked,
          whose sec-3 producer list is (WI-5/6). The word "respectively" has been removed.
        duplicate_risk: >-
          none. WI-14 fires INSTEAD of its targets, from a different From state (ESCALATED), never
          in addition to them.
      - key: 07-conflict:CF-6
        from_to: "ESCALATED -> {RESOLVED_BY_RULE,RESOLVED_BY_HUMAN}"
        resolution:
          RESOLVED_BY_RULE: {targets: [CF-3], owner_event: ConflictResolved}
          RESOLVED_BY_HUMAN: {targets: [CF-4], owner_event: ConflictResolved}
        duplicate_risk: >-
          none. CF-6 fires INSTEAD of CF-3/CF-4, from a different From state (ESCALATED).

  - name: EVENT_REQUIRED
    meaning: >-
      a durable write with no canonical event recording it. GR-2 is VIOLATED by each of these rows
      as written. They are recorded open, not exempted. See founder_gated_event_obligations.
