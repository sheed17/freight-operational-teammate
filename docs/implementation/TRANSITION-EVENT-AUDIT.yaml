# ---------------------------------------------------------------------------------------------
# THE FOUNDER/ARCHITECT BOUNDARY. Seven durable writes that no canonical event recorded.
#
# ### ALL SEVEN ARE NOW DISCHARGED, BY THE FOUNDER/ARCHITECT DECISIONS OF 2026-08-12 (meta
# ### .founder_architect_decisions_2026_08_12), AND EVERY ENTRY IS RETAINED HERE IN FULL.
# ### DELETING ONE IS A BUILD FAILURE, NOT TIDYING. `semantic_obligation` and `why_it_matters` are
# ### preserved verbatim: they are the record of WHAT WAS WRONG, and a repaired defect whose
# ### description has been erased teaches nobody and can silently regress. Each entry now additionally
# ### carries `status`, the `discharging_event`, its `discharge_route` and its authority.
#
# ### THE BOUNDARY ITSELF IS UNCHANGED AND STILL BINDS. No session below founder/architect authority
# ### may mint a canonical event name, change the canonical event total, or mark an obligation
# ### discharged. What changed is that the authority was exercised - explicitly, on the record, for
# ### these seven and no others.
founder_gated_event_obligations:

  - id: G2-OB-PL-7A-AUTONOMOUS-ADMISSION-UNRECORDED
    transition: 02-pipeline-instance:PL-7a
    durable_write: "VALIDATED -> CHECKPOINT"
    severity: HIGHEST GOVERNANCE
    semantic_obligation: >-
      that a pipeline was admitted to checkpoint under autonomous caps, recording the gate decision
      and the caps evaluated.
    why_it_matters: >-
      PL-7a is the SOLE autonomous entry into CHECKPOINT (gate = AUTONOMOUS_WITHIN_CAPS) - the
      bounded-autonomy admission point. Its human-gated sibling PL-7b emits ApprovalBound; PL-7a
      emits nothing. M2 sec 39 requires an audit record for every transition and registry sec 2
      makes the emitted event the audit record, so the one transition where the system proceeds
      WITHOUT a human is the one with no audit record.
    live_exposure: >-
      NONE TODAY. Bounded autonomy is BLOCKED at P14 and ships dark. This was a specification defect
      to fix BEFORE that path is built, and it was fixed before that path was built.
    decision_required: founder/architect - a new canonical event type
    status: DISCHARGED
    discharged_on: "2026-08-12"
    discharging_event: AutonomousAdmissionRecorded
    discharge_route: MINTED_CANONICAL_EVENT
    discharge_authority: FOUNDER/ARCHITECT DECISION D1 (2026-08-12) - mint one canonical fact per obligation
    how_the_obligation_is_now_met: >-
      `AutonomousAdmissionRecorded`(PL-7a) carries `gate_decision` (= AUTONOMOUS_WITHIN_CAPS),
      `caps_evaluated`, `policy_version` and `brake_version` - the gate decision and the caps the
      obligation named. PL-7b keeps `ApprovalBound` and never emits this event, so the one admission
      path with no human in it now has its own audit record and cannot borrow the human path's.

  - id: G2-OB-AP-9-FREEZE-FACT-UNRECORDED
    transition: 04-approval:AP-9
    durable_write: "frozen=true"
    severity: HIGHEST SAFETY OF THE SEVEN
    semantic_obligation: >-
      that an approval was frozen pending established reality, carrying the unknown-outcome
      reference that froze it.
    why_it_matters: >-
      ### `frozen` IS A GUARD INPUT TO AN ILLEGAL DETERMINATION (M4 sec 15 - "reuse of a frozen
      (AP-9) approval -> ILLEGAL"; sec 13 - "MUST NOT be reused until reality established"). It is
      a durable write that appears in NO event, so a full-history rebuild reconstructs an approval
      that is NOT frozen - i.e. REUSABLE. ### THE REBUILT STATE IS LESS SAFE THAN THE ORIGINAL,
      which inverts the purpose of replay (AC-EVT-008).
    admissible_remedies:
      - "AP-9 emits a new canonical Approval* event; or"
      - "the durable write is REMOVED and `frozen` becomes a DERIVED predicate over
         (OutcomeUnknown AND NOT RealityEstablished)."
    remedy_note: >-
      The row as written violates GR-2 under BOTH remedies. Choosing between them is design
      authority. ### DO NOT IMPROVISE THE EVENT DESIGN.
    fail_closed_default_until_decided: >-
      treat any approval with an unresolved OutcomeUnknown as frozen. ### STILL IN FORCE AT RUNTIME.
      The discharge decided what REPLAY reconstructs from; it did not relax the live guard.
    decision_required: founder/architect - emit-vs-derive, then (if emit) a new canonical event type
    status: DISCHARGED
    discharged_on: "2026-08-12"
    discharging_event: ApprovalFrozen
    discharge_route: MINTED_CANONICAL_EVENT
    discharge_authority: FOUNDER/ARCHITECT DECISION D2 (2026-08-12) - EMIT, explicitly NOT derive
    remedy_selected: >-
      the FIRST admissible remedy - AP-9 emits a new canonical Approval* event. ### THE SECOND REMEDY
      (derive `frozen` from OutcomeUnknown AND NOT RealityEstablished) WAS CONSIDERED AND REFUSED BY
      NAME: an absence is only as true as the fold is complete and correctly ordered, and a
      safety-critical quarantine may not rest on either. Deriving would have reproduced the very
      failure this obligation records - a rebuilt approval that is REUSABLE - whenever the fold was
      partial.
    how_the_obligation_is_now_met: >-
      `ApprovalFrozen`(AP-9) carries `frozen=true`, `unknown_outcome_ref` (the `event_id` of the
      OutcomeUnknown that froze it), `effect_grant_id` and `frozen_at`. A full-history rebuild sets
      `frozen=true` because the event is PRESENT (registry ER-16), so the rebuilt approval is no
      longer less safe than the original.

  - id: G2-OB-CF-7-PARTY-ATTACH-FACT-UNRECORDED
    transition: 07-conflict:CF-7
    durable_write: "append parties[]"
    semantic_obligation: >-
      that a new disagreeing party attached to an existing conflict, carrying its provenance_class.
    why_it_matters: >-
      CF-1 places parties[] into history via ConflictRaised; an un-evented append means a
      full-history rebuild reproduces a STALE PARTY SET - an AC-EVT-008 digest divergence, which
      AC-EVT-015 escalates to an auto-brake. M7's own text refutes the old "(no state change)"
      exemption three times (sec 34 Writes include the outbox; sec 39 audit "with parties"; sec 22
      "still an event, never silence"). The old cell answered the From -> To column, not the Event
      column - a category error.
    decision_required: founder/architect - a new canonical event type
    status: DISCHARGED
    discharged_on: "2026-08-12"
    discharging_event: ConflictPartyAttached
    discharge_route: MINTED_CANONICAL_EVENT
    discharge_authority: FOUNDER/ARCHITECT DECISION D1 (2026-08-12)
    how_the_obligation_is_now_met: >-
      `ConflictPartyAttached`(CF-7) carries `party_ref`, the attaching party's `provenance_class`
      (carried, never strengthened - ER-14) and the resulting `parties[]`, so a rebuild reproduces the
      full party set rather than the set as it stood at CF-1. It remains ONE conflict: the dedup index
      still refuses a second ConflictRaised.

  - id: G2-OB-EC-7-SEVERITY-CHANGE-FACT-UNRECORDED
    transition: 09-exception:EC-7
    durable_write: "severity"
    semantic_obligation: >-
      that the severity of an open exception was reassessed, carrying the old and new values and
      the actor.
    why_it_matters: >-
      EC-1 emits ExceptionRaised{severity}, so severity IS in the event stream at creation; EC-7
      mutates it with no event, so a rebuild reproduces the ORIGINAL severity. Severity drives
      EC-4/EC-5 ageing and escalation thresholds and, per M9 sec 30, Sev-0 exceptions auto-engage
      the brake - so a rebuilt projection can UNDER-STATE severity relative to live state.
    decision_required: founder/architect - a new canonical event type
    status: DISCHARGED
    discharged_on: "2026-08-12"
    discharging_event: ExceptionSeverityChanged
    discharge_route: MINTED_CANONICAL_EVENT
    discharge_authority: FOUNDER/ARCHITECT DECISION D1 (2026-08-12)
    how_the_obligation_is_now_met: >-
      `ExceptionSeverityChanged`(EC-7) carries `previous_severity` (old), `severity` (new),
      `changed_by` (the actor the obligation required) and `reason`. Carrying the OLD value as well as
      the new one makes a missing link DETECTABLE in a fold instead of silently absorbed.

  - id: G2-OB-PO-2-PROPOSAL-FACT-UNRECORDED
    transition: 11-policy:PO-2
    durable_write: "DRAFT -> PROPOSED"
    semantic_obligation: >-
      that a policy draft was put forward for approval, carrying the policy_version and the
      gate_decision that had to be non-null for it to proceed.
    why_it_matters: >-
      ### A NAMING COLLISION, NOT MERELY A GAP. PO-1 (- -> DRAFT) emits `PolicyProposed`, so the
      event named "Proposed" fires on the DRAFT transition while the actual DRAFT -> PROPOSED
      transition emits nothing. M11 sec 39 requires every draft/activate/supersede/revoke/expire to
      be an audit AND security event.
    admissible_remedies:
      - "re-attribute `PolicyProposed` to PO-2 and mint a new event for PO-1; or"
      - "mint a new event for PO-2 and leave PO-1's attribution unchanged."
    remedy_note: >-
      Both remedies change the frozen registry (one re-attributes an existing name and adds one;
      the other adds one). Neither is available below founder/architect authority.
    decision_required: founder/architect - re-attribution and/or a new canonical event type
    status: DISCHARGED
    discharged_on: "2026-08-12"
    discharging_event: PolicySubmitted
    discharge_route: MINTED_CANONICAL_EVENT
    discharge_authority: FOUNDER/ARCHITECT DECISION D3 (2026-08-12) - MINT for PO-2, do NOT re-attribute PO-1
    remedy_selected: >-
      the SECOND admissible remedy - mint a new event for PO-2 and leave PO-1's attribution
      unchanged. ### THE FIRST (re-attribute `PolicyProposed` to PO-2 and mint for PO-1) WAS REFUSED
      BY NAME: it would silently change the meaning of every `PolicyProposed` already in history and
      of every consumer reading it, which is the S8 / ER-7 prohibition on correcting the past by
      rewriting it. PO-1 keeps `PolicyProposed`, unchanged in name, producer, payload and consumers.
    how_the_obligation_is_now_met: >-
      `PolicySubmitted`(PO-2) carries `policy_version` and the `gate_decision` that had to be non-null
      for the draft to proceed - exactly the two the obligation named. The naming COLLISION is closed
      by giving the DRAFT -> PROPOSED transition its own name, not by moving the older one.

  - id: G2-OB-PO-3-APPROVAL-FACT-UNRECORDED
    transition: 11-policy:PO-3
    durable_write: "PROPOSED -> APPROVED + approval_id"
    semantic_obligation: >-
      that a policy change was approved through a gated M2 pipeline, binding the approval_id and
      the diff that was the material fact.
    why_it_matters: >-
      This is the "no admin path" evidence. The policy change ran through an M2 pipeline with the
      diff as material facts, binding approval_id. With no event, ### REPLAY AND AUDIT CANNOT PROVE
      A POLICY CHANGE WAS HUMAN-GATED. M11 sec 39's own list omits "approve" as well - the same gap
      in two places.
    decision_required: founder/architect - a new canonical event type
    status: DISCHARGED
    discharged_on: "2026-08-12"
    discharging_event: PolicyApproved
    discharge_route: MINTED_CANONICAL_EVENT
    discharge_authority: FOUNDER/ARCHITECT DECISION D1 (2026-08-12)
    how_the_obligation_is_now_met: >-
      `PolicyApproved`(PO-3) carries `approval_id`, `policy_version`, `diff_fingerprint` (the
      material_facts_fingerprint of the diff), `approved_by` and `evidence_refs`, and it is declared
      CONSEQUENTIAL in events/registry.md sec 5 - so it pins the entity_versions / fingerprint /
      policy_version / brake_version set needed to reproduce the approval context. Replay can now
      prove a policy change was human-gated. The M11 sec 39 list gap is a separate documentation
      residual and is NOT claimed closed here.

  - id: G2-OB-RU-8-EXPIRY-FACT-UNRECORDED
    transition: 12-rule:RU-8
    durable_write: "ACTIVE -> EXPIRED"
    semantic_obligation: >-
      that a narrowing rule reached its TTL and left the ACTIVE set, symmetric with M11's
      PolicyExpired (PO-7).
    why_it_matters: >-
      The fourteenth member of the finding, invisible to the old parser (G2-D1). F12 has no
      expiry event at all, while M11's exact counterpart PO-7 (ACTIVE -> EXPIRED) emits
      PolicyExpired. Rule expiry changes which rules are ACTIVE, which changes checkpoint
