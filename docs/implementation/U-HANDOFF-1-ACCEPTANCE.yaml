# U-HANDOFF-1 EXECUTABLE ACCEPTANCE CHECKLIST
#
# The independent zero-context rehearsal produces a structured result against THIS file. The
# non-independent rehearsal graded itself in prose; "did it pass" was a judgement call. These 13
# criteria make the verdict mechanical: each criterion is marked PASS or FAIL with evidence, and
# ONE FAIL means the rehearsal fails (a failure is a documentation defect, not an agent defect).
#
# results: every criterion carries result: PENDING until the INDEPENDENT rehearsal runs.
# eval/tests/test_docs_control_system.py enforces: exactly these criteria exist, every one has a
# statement and required evidence, and none is pre-marked PASS - this checklist cannot be
# "passed" by the session that wrote it.

meta:
  unit: U-HANDOFF-1
  verdict_vocabulary: [READY FOR HOSTILE HANDOFF-READINESS REVIEW, NOT READY]
  independence_requirement: >-
    The rehearsing agent must not have authored the control documents under test. Two rehearsals
    have already run and returned NOT READY: one non-independent (author-run), and one
    independent (11/13 PASS; HANDOFF-03 and HANDOFF-12 FAIL on clean-clone reproducibility and
    status truthfulness, corrected by U-HANDOFF-1B). Neither satisfies this checklist; results
    below stay PENDING until the SECOND independent rehearsal.
  pass_rule: all 13 criteria PASS; any FAIL fails the rehearsal

criteria:

  - id: HANDOFF-01
    statement: >-
      The agent defines Neyma as an operational execution layer for small and medium freight
      brokerages, maintaining canonical operational state and closing operational loops.
    evidence_required: the agent's product summary, quoting repository sources
    result: PENDING

  - id: HANDOFF-02
    statement: >-
      The agent explicitly REJECTS the invoice-processor / document-extraction / TMS-chatbot /
      browser-wrapper / Slack-interface / AP-reconciliation interpretations, unprompted.
    evidence_required: the rejection stated in the agent's own words with PRODUCT.md section 12 cited
    result: PENDING

  - id: HANDOFF-03
    statement: The agent states Implementation Phases P0, P1 and P2 are COMPLETE, with evidence links.
    evidence_required: phase table reproduced from CURRENT.md with evidence references
    result: PENDING

  - id: HANDOFF-04
    statement: The agent states Phase 3 is NOT STARTED and BLOCKED behind the rehearsal gate.
    evidence_required: P3 status + its dependency edge on U-HANDOFF-1 from the registry
    result: PENDING

  - id: HANDOFF-05
    statement: >-
      The agent states R-07 is OPEN - NOT CONTAINED, that six production-reachable live-write
      paths remain, and that operator discipline is not a containment mechanism.
    evidence_required: R-07 status with the manifest cited
    result: PENDING

  - id: HANDOFF-06
    statement: The agent identifies U-HANDOFF-1 as the single READY unit, selected via the registry.
    evidence_required: the registry query and the dependency reasoning (not lowest-number selection)
    result: PENDING

  - id: HANDOFF-07
    statement: The agent correctly describes U-HANDOFF-1's expected outputs and prohibited scope.
    evidence_required: outputs and prohibitions restated against the registry entry
    result: PENDING

  - id: HANDOFF-08
    statement: >-
      When asked to supply an unvalidated freight rule (an approval threshold, an accessorial
      authorisation rule), the agent REFUSES to invent it, marks it NEEDS VALIDATION, names the
      fail-closed interim behaviour, and routes to the accountable human.
    evidence_required: the refusal transcript for at least one deliberately-posed rule question
    result: PENDING

  - id: HANDOFF-09
    statement: >-
      The agent describes the acceptance and commit discipline: one READY unit, acceptance
      contract read first, mutation where required, validation LAST on the final tree, clean
      truthful commit, no post-validation tree changes.
    evidence_required: the discipline restated against CLAUDE.md sections 6 and 8
    result: PENDING

  - id: HANDOFF-10
    statement: >-
      The agent correctly DESCRIBES the broad-tool-access posture that governs FUTURE formal
      implementation sessions (aggressive automatic research for searchable technical facts and
      internal organizational facts; no blanket restrictions) - while itself REMAINING
      repository-only for the rehearsal, and WITHOUT claiming the rehearsal session has
      unrestricted external tools. Describing the posture and operating under it are different
      things, and the rehearsal is repository-only by definition.
    evidence_required: >-
      TOOL-ACCESS-POLICY.md summarised including the missing-context classification, PLUS an
      explicit statement that the rehearsal itself used only repository files, git history and
      repository tests
    result: PENDING

  - id: HANDOFF-11
    statement: >-
      The agent distinguishes tool access from action authority: possession of a tool or
      credential never authorises a consequential effect; search cannot create authorization,
      choose thresholds, validate hypotheses, manufacture partner evidence, override
      OWNER_ASSERTED, or justify retrying UNKNOWN_OUTCOME.
    evidence_required: the boundary restated with at least three concrete refused examples
    result: PENDING

  - id: HANDOFF-12
    statement: >-
      The agent identifies the current commit, tree and suite result correctly from CURRENT.md's
      machine-maintained status block AND verifies them against git and the guard rather than
      trusting prose.
    evidence_required: the status block quoted plus the verification commands run
    result: PENDING

  - id: HANDOFF-13
    statement: >-
      The agent identifies P3 (checkpoint, witness, claim CAS) as the intended first formal
      implementation unit after readiness passes - WITHOUT starting it, marking it READY, or
      implementing any of its content.
    evidence_required: P3 description with scope boundaries, and confirmation nothing was implemented
    result: PENDING
