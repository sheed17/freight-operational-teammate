# IMPLEMENTATION REGISTRY
#
# The single machine-readable control record of implementation work units, and THE canonical
# machine-readable authority for every unit's state. Navigation documents (CLAUDE.md sec 3,
# README.md, ARCHITECTURE.md sec 28, PRODUCT.md sec 13, PHASE-OUTPUTS.md, the agent lenses)
# RESTATE this record; they never establish it, and eval/tests/test_roadmap_completeness_control.py
# fails the build when a restatement drifts from it.
#
# THREE ORTHOGONAL STATE FIELDS PER UNIT (see meta.status_model below - read it before editing any
# of them). They answer three different questions, and conflating them is what allowed one file to
# say "P4 is READY" while another said "P4 has not begun" and a third recorded two landed P4
# checkpoints - all three true of different questions, all three read as one contradiction:
#
#   status           - UNIT-SELECTION state:  may this unit be worked on, and is it the next one?
#                      EXACTLY: BLOCKED | READY | IN_PROGRESS | COMPLETE
#   execution_state  - PHASE-EXECUTION state: has work actually landed inside it?
#                      EXACTLY: NOT_STARTED | IN_PROGRESS | COMPLETE
#   checkpoint_state - CHECKPOINT/REVIEW state: how far up the review ladder has it climbed?
#                      EXACTLY: NO_CHECKPOINT | CHECKPOINT_IMPLEMENTED |
#                               CHECKPOINT_INDEPENDENTLY_REVIEWED |
#                               CHECKPOINT_ACCEPTED_FOR_CONTINUATION |
#                               FINAL_ADJUDICATION_PENDING | PHASE_ACCEPTANCE_COMPLETE
#
# There is deliberately no "mostly done", "nearly ready" or "in review". A unit that is not
# COMPLETE is not done, and a unit that is not READY may not be started. READY does NOT mean
# "not begun" - that reading is exactly the contradiction this model removes.
#
# Guarded by eval/tests/test_docs_control_system.py:
#   - exactly one unit may be READY at a time
#   - no unit may be both BLOCKED and READY
#   - every READY unit must name dependencies and an acceptance contract
#   - every unit's dependencies must exist in this file
# and by eval/tests/test_roadmap_completeness_control.py:
#   - the three state fields are individually valid and mutually consistent
#   - at most one unit is executing, and it is the mechanically derived active phase
#   - a claimed independent checkpoint review must cite a report that exists on disk
#   - P13 cannot be COMPLETE while any required sub-unit is incomplete
#   - no navigation document may restate a phase state the registry does not hold
#
# Sequencing authority: implementation-roadmap.md (phases P0-P14, gates G0-G10).
# Short-form status authority for humans: CURRENT.md. Machine authority for unit state: THIS FILE.

meta:
  version: 3
  # The three fields below MIRROR the machine-maintained status block in CURRENT.md and are
  # rewritten by scripts/finalize_status.py::_write_status (scripts/update_current_status.py has
  # been a refusing shim since U-HANDOFF-1C and writes nothing). test_status_reality.py fails
  # the build if they disagree with CURRENT.md or with the checked-out commit.
  baseline_commit: 42ea24cfc76fac19406e7eaa44b695b8d032b3aa
  validated_tree: 1e2bba791a5c2c77194d1df9ce16e1d9df84315a
  suite: "1961 passed, 0 failed, 1 conditionally justified skip"
  status_convention: >-
    Two-commit convention: content commit first, then exactly one status-metadata commit that
    records it. A commit cannot contain its own hash, so baseline_commit names the content
    baseline and HEAD is either that commit or the single metadata commit on top of it.
  graph_model: >-
    U-HANDOFF-1B (M-1): `dependencies` is the AUTHORITATIVE graph field. `unlocked_by`, `blocks`
    and `next_units_unlocked` are DERIVED views - unlocked_by mirrors dependencies exactly, and
    blocks/next_units_unlocked both mirror the exact dependent set - and a full-graph consistency
    guard fails the build on any divergence, missing node, cycle, or edge that would let a unit
    bypass the P3/P4/P5 safety wall. The independent rehearsal found eight reverse-edge
    inconsistencies in the hand-maintained fields; hand-maintenance is over.
  phase_numbering: >-
    P0-P14 with gates G0-G10, per implementation-roadmap.md. This is the repository's approved
    numbering. The 8-stage roadmap in docs/PRODUCT_ROADMAP.md is SUPERSEDED and must not be used.
  progress_protocol: >-
    Progress is reported per docs/implementation/PROGRESS-PROTOCOL.md. Each phase's completion is
    computed from its weighted acceptance contract (the acceptance_template in PROGRAM-WEIGHTS.yaml,
    or a phase's committed acceptance_criteria override); overall program completion is the
    program_weight-weighted sum in PROGRAM-WEIGHTS.yaml. The finalizer derives BUILD-STATUS.yaml
    and refuses inflated numbers. Every session prints the NEYMA BUILD STATUS block and stops at
    the next approved control boundary.

  # ---------------------------------------------------------------- the three-field status model
  # Added by the roadmap-completeness control correction. It introduces NO new status system: it
  # separates three questions that the single `status` field was being asked to answer at once.
  status_model:
    why: >-
      One field was carrying three meanings, so every honest sentence about P4 contradicted
      another honest sentence. "P4 is the sole READY unit" (selection), "P4 has not begun"
      (execution) and "two P4 implementation checkpoints landed" (checkpoint) were all written as
      status claims about the same word. They are now three fields with three vocabularies, and a
      guard enforces the relationships between them.
    status:
      question: "May this unit be worked on, and is it the approved next one?"
      values: [BLOCKED, READY, IN_PROGRESS, COMPLETE]
      meaning: >-
        The UNIT-SELECTION / eligibility state. It answers CLAUDE.md sec 6 step 2 - "identify
        exactly ONE READY work unit". READY means SELECTED AND PERMITTED, never "untouched".
      deliberately_unchanged: >-
        THE SELECTOR MUST ALWAYS NAME EXACTLY ONE READY UNIT, and a unit may leave READY only when
        a successor takes it IN THE SAME COMMIT. READY is the field the whole control system
        selects on: scripts/progress_status.py::single_ready_unit returns the unique READY unit,
        the finalizer refuses a BUILD-STATUS whose single_ready_unit disagrees with it, and five
        guards assert the exact READY set. Vacating READY without a successor would leave ZERO
        READY units, so the repository could no longer name its next approved unit - a
        control-system hole, not a tidy-up. This is why P4 stayed READY for the whole time it was
        executing (execution was recorded in execution_state, not by vacating the selector), and
        why the P4 -> P5 handover is a single commit in which P4 becomes COMPLETE and P5 becomes
        the sole READY unit. Being READY is a SELECTION, never a claim that work has begun: P5's
        execution_state is NOT_STARTED and P5 work has not started.
    execution_state:
      question: "Has implementation work actually landed inside this unit?"
      values: [NOT_STARTED, IN_PROGRESS, COMPLETE]
      meaning: >-
        The PHASE-EXECUTION state, and the field a navigation document must mirror when it says a
        phase is "NOT STARTED", "IN PROGRESS" or "COMPLETE". IN_PROGRESS requires at least one
        landed_checkpoints entry whose evidence exists on disk - a phase cannot claim execution
        with nothing to show.
      contributes_to_percentages: false   # only PASS acceptance criteria move a percentage
    checkpoint_state:
      question: "How far has the review ladder been climbed inside this unit?"
      values:
        - NO_CHECKPOINT                          # nothing landed
        - CHECKPOINT_IMPLEMENTED                 # work landed; no independent review yet
        - CHECKPOINT_INDEPENDENTLY_REVIEWED      # a session that did not implement it reviewed it
        - CHECKPOINT_ACCEPTED_FOR_CONTINUATION   # reviewed, findings mandated, work may continue
        - FINAL_ADJUDICATION_PENDING             # scope complete; awaiting the adjudicating session
        - PHASE_ACCEPTANCE_COMPLETE              # all weighted criteria PASS; the unit is COMPLETE
      meaning: >-
        A checkpoint is a landed increment, NEVER an acceptance. Climbing this ladder moves no
        percentage and completes no phase: only the weighted acceptance_criteria do that, and
        independent_review + final_adjudication structurally cannot be self-supplied
        (PROGRESS-PROTOCOL.md sec 3, CLAUDE.md sec 11).
    invariants:
      - "status COMPLETE <=> execution_state COMPLETE <=> checkpoint_state PHASE_ACCEPTANCE_COMPLETE"
      - "status BLOCKED => execution_state NOT_STARTED and checkpoint_state NO_CHECKPOINT"
      - "execution_state IN_PROGRESS => status in {READY, IN_PROGRESS} and >=1 landed checkpoint"
      - "execution_state NOT_STARTED => no landed_checkpoints entries"
      - "checkpoint_state INDEPENDENTLY_REVIEWED or ACCEPTED_FOR_CONTINUATION => the cited
         independent review report exists on disk"
      - "at most one unit may be execution_state IN_PROGRESS, and it must equal the derived
         BUILD-STATUS active_phase"

