      # 021a9a2, and the landing made none.
      - id: P6-D24
        finding: >-
          ### A STRICT-ORDER CONSUMER MUST SUPPLY `drain_handler_for`, OR A PARKED EVENT LEAVES THE
          PARK ONLY BY M-26 EXPIRY. A redelivery of an already-parked event is counted
          `ALREADY_PARKED` and does NOT re-evaluate the gap. Recorded by the P6-D11 builder;
          REPRODUCED rather than deferred to by the independent review (without a drain factory v5
          and v3 park while v1 applies and neither parked event is re-examined; with one supplied on
          the unblocking consume the handler sees [1, 3, 5] and the park empties); and classified
          `A` - a valid nonblocking M3 obligation, correctly characterized - by the targeted
          adjudication.
        disposition: >-
          ### CARRIED FORWARD AS AN M3 OBLIGATION, NONBLOCKING, AND THE SHARED RUNTIME IS NOT
          MODIFIED FOR IT BY THIS LANDING. (1) It is P6-CP-1's landed, adjudicated F-04 design and is
