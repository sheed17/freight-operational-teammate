        finding: >-
          WI-3's `obligation_satisfied` is a fact the CALLER states; M1 will not derive it from a
          `PipelineClosed` arriving.
        disposition: >-
          This is acceptance (d), not a gap: billed is not paid, and a Work Item is 1:N to its
          Pipelines. A machine that derived it would close obligations early and be right most of the
          time, which is the worst possible failure profile for money.
        severity: NONE - by design
        closes_at: not a defect
      - id: P6-D6
        finding: >-
          A parked trigger for a not-yet-existing Work Item does not drain when the item is CREATED.
          P5's drain is keyed on the APPLIED event's own aggregate, and WI-1 creation is an
          ORIGINATED act rather than a consumed one.
        disposition: >-
          The safety-critical half is complete: the event is never dropped, never retried forever,
          and expires into a problem owned by a named human. Draining on creation needs the parked
          trigger's FACTS to travel with the event — `obligation_satisfied`, the failure disposition,
          the block reason — and those are supplied by the producer, which is the Pipeline Instance.
          Building a facts-carrying drain here would be building infrastructure the next unit owns.
        severity: LOW
        closes_at: the Pipeline Instance unit
