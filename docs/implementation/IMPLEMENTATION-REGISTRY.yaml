    allowed_scope: [the Delivered Load Closure shadow slice, read-only, drafts-only communications]
    prohibited_scope: [external writes of any kind, outbound sends of any kind]
    expected_production_outputs: [the Delivered Load Closure shadow pipeline, wedge-outcome instrumentation, no effects]
    expected_capability: >-
      USER-VISIBLE, FIRST TIME: a brokerage sees delivered loads carried to billing-ready with
