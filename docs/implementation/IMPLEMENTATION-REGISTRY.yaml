      platform_capability: grant-backed witness-gated writes and sends in production, delivery-state verification, unknown-outcome operations
      evidence_requirements: [G8 record, a live G4 re-run, per-class supervised operation logs]
      hostile_cases: [a duplicate send, a send without a grant, an unknown delivery outcome auto-resolved, a quiet-hours violation, an opt-out violation, a send to a misbound recipient]
      rollout_posture: per (tenant, action_class) capability flags, owner-enabled in writing; disable returns to human-executed
      observability_requirements: [UNKNOWN_OUTCOME rate (the single most important number - rising rate demotes), wrong actions (any occurrence demotes), delivery states, approval turnaround]
