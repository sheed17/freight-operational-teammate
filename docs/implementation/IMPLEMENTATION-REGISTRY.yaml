    completion_evidence: ["a phase-10 implementation review", "the G5 gate record"]
    rebaseline_contract:
      user_visible_capability: FIRST REAL USER VALUE - delivered loads carried to billing-ready, with drafted follow-ups
      platform_capability: the wedge outcome end-to-end in shadow; wedge-outcome instrumentation (PRODUCT.md section 15 metrics)
      evidence_requirements: [G5 record, wedge metrics baselined against the partner's real loads, DESIGN-PARTNER-EVIDENCE-PROGRAM items consumed with sources]
      hostile_cases: [an attempted send from shadow mode, an attempted write from shadow mode, an invented accessorial or billing rule, fabricated design-partner validation]
      rollout_posture: read-only and drafts-only by construction
      observability_requirements: [wedge outcome metrics live, drafted-vs-would-have-sent log]
      security_requirements: [no effect channel reachable from the slice, documents content-addressed]
      readiness_target: PILOT_READY for the shadow slice
    next_units_unlocked: [P11]

  - unit_id: P11
