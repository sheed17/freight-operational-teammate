    acceptance_contract: "gate G8; G4 RE-RUN LIVE"
    concurrency_requirements: required
    mutation_requirements: required
    migration_requirements: none
    legacy_dispositions_affected: [browser_write_path, tms_write]
    rollback_posture: "Capability flag; the brake refuses admission."
