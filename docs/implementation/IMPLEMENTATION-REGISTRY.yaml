          adjudicator's condition A-3 required be written down. The same mutation harness CAUGHT the
          disarming-banner guard on the recovered review report, so the harness itself is proven able
          to fail.
        disposition: >-
          ### RECORDED, NOT ACTIONED, AND THE RULE IS STILL WORTH STATING. A-3 asked that the
          constraint be STATED IN CANON so M3's author - a fresh session with no history - inherits
          it rather than rediscovering it as a permanent stall; an unwritten constraint is, by this
          repository's own rule, not decided. That is discharged. What is NOT discharged is
          MECHANICAL enforcement, and it cannot be here: the rule constrains a CONSUMER'S
