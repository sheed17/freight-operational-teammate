# IMPLEMENTATION REGISTRY
#
# The single machine-readable control record of implementation work units.
#
# Statuses are EXACTLY: BLOCKED | READY | IN_PROGRESS | COMPLETE
# There is deliberately no "mostly done", "nearly ready" or "in review". A unit that is not
# COMPLETE is not done, and a unit that is not READY may not be started.
#
# Guarded by eval/tests/test_docs_control_system.py:
#   - exactly one unit may be READY at a time
#   - no unit may be both BLOCKED and READY
#   - every READY unit must name dependencies and an acceptance contract
#   - every unit's dependencies must exist in this file
#
# Sequencing authority: implementation-roadmap.md (phases P0-P14, gates G0-G10).
# Status authority: CURRENT.md.

meta:
  version: 2
  # The three fields below MIRROR the machine-maintained status block in CURRENT.md and are
  # rewritten by the same script (scripts/update_current_status.py). test_status_reality.py fails
  # the build if they disagree with CURRENT.md or with the checked-out commit.
  baseline_commit: fde6c9531fa22761799f81e55d6022640697f85c
  validated_tree: 1f046f3925fde9e57d8c7de470a4f9f30a4fc4a2
  suite: "1179 passed, 0 failed, 1 conditionally justified skip"
  status_convention: >-
    Two-commit convention: content commit first, then exactly one status-metadata commit that
    records it. A commit cannot contain its own hash, so baseline_commit names the content
    baseline and HEAD is either that commit or the single metadata commit on top of it.
  phase_numbering: >-
    P0-P14 with gates G0-G10, per implementation-roadmap.md. This is the repository's approved
    numbering. The 8-stage roadmap in docs/PRODUCT_ROADMAP.md is SUPERSEDED and must not be used.

