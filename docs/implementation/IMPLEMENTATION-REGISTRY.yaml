          `_park_locked`, the drain path and `ALREADY_PARKED` did not. (2) It FAILS SAFE rather than
          silently wrong - the event stays PARKED with its arrival order, its accountable owner and
          an M-26 TTL that surfaces an owned exception; it is never dropped and never applied out of
          order. (3) It is an EXPLICIT API CONTRACT, not a latent trap: `drain_handler_for` is a
          named parameter on `consume`, and supplying it drains in order. (4) It is deliberate - a
          caller may not consume another caller's parked envelope through a handler it guessed at.
          (5) M3 does not exist, so no consumer can be wrong today, and P6-D11 STRICTLY REDUCES
          exposure to it: pre-fix every attempt parked, post-fix only genuine loss or reorder does.
          ### M3's strict consumer owes the drain_handler_for behaviour so a parked event is
          re-evaluated when its predecessor becomes available, rather than waiting solely for M-26
          expiry.
        severity: LOW - nonblocking
        closes_at: M3
      - id: P6-D27
        finding: >-
          ### THE CHAIN-FORK / EMISSION-MONOTONICITY GAP. NEW, raised by the targeted adjudication of
          021a9a2 and CONSTRUCTED at the outbox rather than reasoned about. The consumer's "apply
          anything at or below the high-water mark" branch is safe only while the predecessor chain
          is a PATH. If a producer emitted a LOWER aggregate_version after a higher one on one
          aggregate, two events would declare the same predecessor and the later-arriving lower one
          would apply AFTER the higher - a silent strict-order violation. The adjudicator built it
          and it is NOT refused.
        disposition: >-
          ### THE ADJUDICATOR'S EXACT DISPOSITION, PRESERVED RATHER THAN PARAPHRASED: nonblocking,
          because it is UNREACHABLE THROUGH EVERY CANONICAL PRODUCER - M2 allocates `item.version + 1`
          under OCC and its F14 record rides at the CURRENT (maximal) version, so emitted versions
          are NON-DECREASING; it ships dark with ZERO production importers; and it requires a future
          producer defect that is independently a strict-order violation.
          ### ITS HONEST CAVEAT, ALSO PRESERVED: "the old rule failed CLOSED here and the new one
          fails OPEN, though only because the old rule parked everything, correct traffic included."
          ### NAMED MECHANICAL CLOSE for whoever takes it: refuse at `emit` any strict-aggregate
          envelope whose `aggregate_version` is strictly below that aggregate's maximum emitted
          version - `<`, NEVER `<=`, because equality is the legitimate sibling and F14 case.
          ### NOT REMEDIATED BY THIS LANDING, and it must not be remediated by a session that cannot
          run the route.
        severity: LOW - nonblocking, unreachable through current canonical producers
        closes_at: the first strict-order producer added after M2, before it ships
      - id: P6-D28
        finding: >-
