  expected_founder_experience: >-
    ### P5 IS DONE, AND IT IS THE LAST PURE-INFRASTRUCTURE PHASE BEFORE THE MODEL OF FREIGHT ITSELF.
    Neyma can now hold durable operational state that survives a crash and can be rebuilt from
    history without ever re-executing an effect. Concretely: a state change and the events it emits
    commit atomically or not at all, so a crash between them leaves NEITHER; a redelivered message is
    a no-op rather than a second effect; events that arrive out of order park and drain in order; an
    event referring to something that does not exist yet parks WITH ITS ACCOUNTABLE HUMAN and is
    drained or expired, never silently dropped; state rebuilt from history is a pure function of the
    SET of events; an audit can explain a past decision using the beliefs OF THAT DAY, naming what it
    cannot reconstruct instead of inventing it; timers survive a full restart and fire exactly once;
    and all of it runs on production PostgreSQL with the durable invariants enforced by database
    trigger rather than by convention. The invariant that matters most is structural: REPLAY CANNOT
    CALL AN ADAPTER, because event_replay's entire transitive import closure is five inert modules —
    it is not that replay declines to touch the outside world, it is that it cannot reach it.
    It did not get there by assertion. A fresh independent session attacked the surface with 45
    hostile probes and found NO material blocking defect, and disclosed eight of its own probes as
    defective rather than only publishing the corrected results. A separate adjudicating session then
    re-ran the whole evidence chain itself — suite, clean-clone gate, a PostgreSQL gate against a
    database it created, both mutation batteries, and its own import-closure probe whose first
    version it reported as unable to fail before fixing it — and set all fourteen criteria PASS.
    Nothing looks different from the outside, deliberately: P5 ships DARK with zero production
    callers, and completing it enables no external effect, registers no policy gate and grants no
    autonomy. ### TWO HONEST CAVEATS. First, the commit recording all this is NOT YET FINALIZED, and
    P6 may not begin until it is: a closure commit owes a targeted independent review, a separate
    targeted adjudication and exactly one finalizer, in that order — the same sequence P4 and R-07
    each went through. That is recording discipline, not more engineering, and no P5 code is owed.
    Second, "runs on PostgreSQL" means proven against a real server, NOT deployed to staging;
    deployment, monitoring and environments are P11. Next up is P6 — the Work Item with a
    structurally accountable human owner — which is where the system starts modelling freight rather
    than the machinery underneath it. Expect no usable interface until P10.
    --- PRIOR PHASE ---
    The payoff phase is done. P4 — adapter containment — is WRITTEN, GREEN, FINALIZED and now
    ADJUDICATED COMPLETE at 14/14 weighted criteria, and it did not get there easily: its first
    independent review REJECTED it outright, a separate session fixed both blocking findings, a
