  - case: AC-SEC-001
    status: RED_BY_DESIGN
    reason: 7 of 8 tables are not tenant-first (DEF-6)
    green_at_phase: P2
    accountable_unit: U2.1
  - case: AC-CKPT-6-missing
    status: DEFERRED_BY_DEPENDENCY - REQUIRED AT PHASE 8
    reason: >-
      The case asserts that an action class with a NULL policy gate causes the system to FAIL TO
      START. It remains DEFERRED, but its GROUND WAS CORRECTED at P3 (independent-review finding
      F-G / F-2 adjudication) and the original wording is superseded.

      SUPERSEDED GROUND: "typed policy and action classes do not exist until P8". That is no
      longer true and must not be repeated. P3 legitimately contains the MINIMAL STRUCTURAL
      contract checkpoint step 5 (policy_evaluation) cannot be written without: the GateDecision
      vocabulary and a fail-closed GateRegistry lookup. A checkpoint step that evaluates policy
      needs a typed gate to evaluate, and a gate expressible as an absence is not a gate.

      THE CORRECTED, CURRENT GROUND: the case is about STARTUP over a REGISTERED PRODUCTION
      POPULATION, and that population is still EMPTY. P3 ships dark - no production module
      constructs a GateRegistry or registers an action class; every registry in the tree is built
      by a test or by a caller that does not exist yet. So running the probe today would still
      evaluate ZERO gates and report green: the exact false-green M-9 pattern, and the same error
      as PL-6 (a gate enabled before the thing it gates exists). Proven mechanically, not
      asserted, by test_phase0_null_gate.py::test_the_production_gate_registration_population_is_
      still_empty - which is what keeps this deferral honest instead of habitual.

      WHAT P8 STILL OWNS, and what therefore still gates this case: rule authoring, compilation,
      versioning, activation, precedence and conflict resolution, richer action-class descriptors,
      the autonomy runtime, and the expectation/exception/compensation systems. Startup-time
      registration of action classes arrives with those, and the case becomes executable then.

      It is therefore declared not-yet-executable rather than passed. See finding P0-F1: the
      frozen plan lists U0.3 as a Phase-0 unit, which is not achievable.
    green_at_phase: P8
    accountable_unit: U8.1

