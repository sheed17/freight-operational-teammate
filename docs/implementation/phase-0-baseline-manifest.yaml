    effect boundary, and the U4.9 boundary-aware import gate is ON and asserts the effect-capable
    violation surface is EMPTY - 0 live and 0 recorded edges, agreeing both-sided.
  containment_mechanism: >-
    STRUCTURAL, and stated as a mechanism rather than as a test result. An external effect can be
    produced only by an effect-capable adapter; an effect-capable adapter can be imported only by
    the containment boundary, another adapter, or a recorded quarantine importer; and the CI import
    gate (eval/tests/test_import_gate.py, over eval/phase0/import_probe.py) fails the build if any
    other importer exists - live and recorded, both-sided, so an unrecorded cut and an unperformed
    recorded cut each fail. The single application route into an effect-capable adapter is therefore
    src/freight_recon/effect_boundary.py, and inside it the only external-write construction and
    execution path is execute_invoice_write: a narrowly typed InvoiceWriteOperation that must pass
    the seven-step atomic checkpoint, a fresh Checkpoint Witness, an Effect Grant and an atomic
    claim before an adapter is called. Anything that cannot present that chain does not fall back -
    it REFUSES. The deployed authenticated Slack callback reaches this boundary and the governed
    kernel seam through governed_write_route.py, and with no kernel registered it answers a recorded
    ROUTE_NOT_CONFIGURED refusal rather than proceeding. There is no reachable legacy
    callback-to-actuator route: run_action_callback_server.py imports no effect-capable adapter,
    constructs no live-write driver, and passes operation_router=None unconditionally.
