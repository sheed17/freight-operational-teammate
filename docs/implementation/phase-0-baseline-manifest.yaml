    reason: a test asserting the defect will fight the fix
    risk_id: R-02
    acceptance: AC-SAFE-012
    removed_by_phase: P1
    accountable_unit: U1.4
    deletion_condition: the assertion is inverted and cannot be restored without failing AC-SAFE-012

  # --- Defects found BY Phase 0, in the frozen corpus itself. These block G1/G2, not P1. ---
  - id: DEF-4
    fact: >-
      The frozen corpus declares 141 machine transitions. The 13 machine files enumerate 134, and
      the acceptance spec's OWN per-machine table sums to 134.
    reason: >-
      An arithmetic error propagated to six places, including release gate G1 ("141/141") and
      AC-MACH-000 ("a bijection with the 141 spec rows"). A correct implementation of all 134 spec
      transitions would FAIL that bijection forever. Both tempting fixes are bad: invent 7
      transitions, or weaken the bijection to an inequality.
    risk_id: P0-F2
    acceptance: AC-MACH-000
    status: CORRECTED 2026-07-16 by the Canonical Corpus Errata Pass
    removed_by_phase: P0 (errata) - CLOSED
    accountable_unit: U0.8
    deletion_condition: >-
      CLOSED: the corpus was amended to its own enumeration (134). The transitions were NOT invented
      and the bijection was NOT weakened. The probe now asserts EXACT SET EQUALITY, not a count.

  - id: DEF-5
    fact: >-
      The frozen corpus declares 92 emitted events. The canonical event list (events/registry.md
      section 3) enumerates 98 across F1..F13.
    reason: >-
      Same class as DEF-4. F14 (13 security events) is correct. F15 is a lens and declares no
      contracts. AC-EVT-003 asserts a "141 to 92 map" - both numbers are wrong.
    risk_id: P0-F2
    acceptance: AC-EVT-003
    status: CORRECTED 2026-07-16 by the Canonical Corpus Errata Pass
    removed_by_phase: P0 (errata) - CLOSED
    accountable_unit: U0.8
    deletion_condition: >-
      CLOSED: the corpus was amended to its own enumeration (98). No events were invented to preserve
      the old total. The probe now asserts EXACT SET EQUALITY over event names.

  - id: DEF-6
    fact: >-
      The frozen plan states "6 of 8 tables are not tenant-first" in seven places. Exactly one table
      (autonomous_run_counters) is tenant-first, so the true count is 7 of 8.
    reason: >-
      Not a harmless typo. U2.1 is scoped to "the 6 offending tables". Executed literally, Phase 2
      would migrate 6, leave 1 non-tenant-first, and AC-SEC-001 would stay red with the phase marked
      done.
    risk_id: R-06
    acceptance: AC-SEC-001
    removed_by_phase: P2
    accountable_unit: U2.1
    scope_corrected: >-
      2026-07-16 errata: every normative statement now says 7 of 8, and U2.1 is scoped by the EXACT
      SET of seven tables enumerated in migration-plan.md PART 7 - never by count. The SCHEMA itself
      is unchanged and still non-canonical; only the scope statement was wrong and is now right.
    deletion_condition: all 8 tables are tenant-first and AC-SEC-001 is green

# ---------------------------------------------------------------------------------------------
# EXPECTED_NONCANONICAL_SCHEMA - recorded, not migrated. Phase 0 changes no schema.
# ---------------------------------------------------------------------------------------------
expected_noncanonical_schema:
  reason: >-
    CLOSED by U2.6BC (Phase 2). Tenant is now FIRST in the key of every tenant-owned table, so the
    uniqueness domain is per-tenant. The stated deletion condition was "this list must reach empty";
    it has. The entry is KEPT, empty, rather than deleted: an absent section would read as "nobody
    checked", and the empty list is what the guard asserts against.
  risk_id: R-06
  acceptance: AC-SEC-001
  removed_by_phase: P2
  accountable_unit: U2.1 / U2.6BC
  deletion_condition: every table below is tenant-first; this list must reach empty
  status: >-
    MET at U2.6BC. operation_commit_claims - the table that HAD a tenant column and was still unsafe
    because its PRIMARY KEY was commit_key alone - is gone: it became the canonical effect_grants
    ledger, keyed (tenant, grant_id) with UNIQUE (tenant, commit_key).
  tables_not_tenant_first: []
  tables_tenant_first:
    - autonomous_run_counters
    - workflow_runs
    - audit_events
    - security_events
    - operation_action_claims
    - delivery_action_claims
    - effect_grants
    - operation_token_amounts
    # Phase 3 (checkpoint kernel) - born tenant-first; never migrated because never legacy:
    - checkpoint_witnesses
    - brakes
  # Deliberately NOT tenant-owned. Each member adjudicated - this is not an exemption hatch,
  # (no count is stated here on purpose: the hand-typed "Two members" had already drifted to three
  # before P3 and to four with platform_brake. A comment cannot be mechanically recomputed, so it
  # names no number; the exact membership is guarded in test_bootstrap_hermeticity.)
  # and a table added here without a reason fails the guard.
  tables_tenant_exempt:
    - table: migration_quarantine
      reason: >-
        It holds rows whose tenant is BY DEFINITION unknown - it is the table that exists BECAUSE
        ownership could not be established without inference. A tenant column here would force the
        exact guess Phase 2 refuses, at the one moment we have already proven we cannot make it.
      removed_by_phase: never (structural)
      accountable_unit: U2.6BC
      deletion_condition: >-
        none. If this table ever becomes tenant-first, quarantine has started inferring ownership.
    - table: schema_migrations
      reason: >-
        It records what ran against the DATABASE. A database is not a tenant, and stamping migration
        steps per-tenant would imply a tenant can be migrated independently, which is false.
      removed_by_phase: never (structural)
      accountable_unit: U2.6BC
      deletion_condition: none
    - table: owner_assertions
      reason: >-
        Blocker 2's owner-assertion audit record. It is migration BOOKKEEPING, not tenant-owned
        business data: a row records WHO asserted that some tenant owns historical rows, so the
        tenant is the subject of the record rather than its owner. Tenant-first keying would make
        the audit of a disputed ownership claim itself owned by one of the disputing tenants.
      removed_by_phase: not removed - permanent audit surface
      accountable_unit: U2.6BC Blocker 2
      deletion_condition: >-
        None. This is a durable audit table. Its exemption is bounded instead by a guard: it may
        never carry commit_key + state (that would make it a second effect ledger), and readiness
        asserts the canonical table set exactly, so it cannot quietly become business data.
    - table: platform_brake
      reason: >-
        The ONE global admission brake (M13 section 17, SD-12) - a single row, id constrained to
        1, engaged by a human or a Sev-0 detector when the failure is bigger than any tenant
        (tenant-isolation breach). It is BY DEFINITION nobody's tenant data: a tenant column here
        would make the platform stop a per-tenant fact, and "which tenant owns the platform
        brake" is a question with no honest answer. Its version is bound into every witness and
        grant and re-validated by the claim CAS, so it denies admission for EVERY tenant at once.
      removed_by_phase: never (structural)
      accountable_unit: P3
      deletion_condition: >-
        none. If this table ever grows a tenant column, the global brake has become a per-tenant
        brake and a tenant-isolation breach can no longer stop the platform.

# ---------------------------------------------------------------------------------------------
# EXPECTED_LEGACY_PATH - the formerly ungated live-write paths. See R-07 / PL-18.
#
# ### R-07 IS RECORDED CONTAINED HERE, AND THIS IS THE RECORD THAT CLOSES IT. Every earlier act -
# the cutover, the boundary, the gate flip to EMPTY, P4's 14/14 weighted acceptance, both
# finalization passes - built and certified the MECHANISM. None of them was this recording, and the
# repository said so at every step (adjudication sec G.5, first-finalization report sec 7.3,
# targeted adjudication sec H, CLAUDE.md sec 11). This file is not a STATUS_METADATA_FILE, so the
# record could only ever land in a content commit AFTER the second finalizer - which is what this
# commit is. The full evidence chain is under `containment_evidence` below.
#
# ### CONTAINMENT MEANS EXACTLY ONE THING HERE: external-effect paths are STRUCTURALLY FORCED
# through the governed boundary or they FAIL CLOSED. It does NOT mean production writes are
# enabled, it does NOT mean a production gate was registered, and it does NOT mean any autonomy -
# bounded or otherwise - was granted. The capability still ships DARK.
# ---------------------------------------------------------------------------------------------
expected_legacy_paths:
  reason: >-
    HISTORICAL PREMISE, retained verbatim in substance because a finding whose premise disappears
    when the finding closes is a finding nobody can audit: at the Phase-0 baseline these paths could
    execute real external effects with no checkpoint, no witness and no grant. Phase 0 made them
    visible; it did not make them safe. That premise held from P0 through P3 and is the reason this
    entry exists. It no longer describes the code: see `status` and `containment_mechanism` below.
  risk_id: R-07
  status: CONTAINED
  contained_at: >-
    P4 - recorded by the R-07 closure content commit whose parent is the second-finalizer metadata
    commit 06ebfdb35a544df8e9cf36d739cc54a0b6877e1f. P4's weighted acceptance (14/14, 100/100) and
    both finalization passes preceded this record and did NOT constitute it.
  removed_by_phase: P4
  accountable_unit: U4.6 (delete), U4.7 (de-actuate), U4.8 (convert)
  deletion_condition: >-
    MET. EP-6/7/9/10 are physically deleted (proved by on-disk absence, not by record), orient_tms
    (EP-8) lost its actuator import and holds a read-only cdp_readonly surface, EP-3 and EP-14 are
