        symbol: effect_grants
      - path: src/freight_recon/workflow.py
        symbol: claim_operation_commit
    owning_unit: P2
    note: one canonical ledger, 8 states in the CHECK constraint, (tenant, commit_key) unique

  - name: Checkpoint (seven-step)
