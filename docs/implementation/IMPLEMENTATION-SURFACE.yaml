# IMPLEMENTATION SURFACE REGISTRY
#
# Which load-bearing architecture concepts are IMPLEMENTED versus SPECIFICATION_ONLY.
#
# The zero-context rehearsal had to grep the source tree to answer this question - the distinction
# lived only in prose. This registry makes it machine-checkable, and
# eval/tests/test_docs_control_system.py enforces it in both directions:
#
#   - IMPLEMENTED / PARTIALLY_IMPLEMENTED / LEGACY_IMPLEMENTATION entries must cite evidence
#     (file + symbol) that actually exists in the tree; and
#   - SPECIFICATION_ONLY / BLOCKED entries must cite absent_symbols that are verifiably ABSENT
#     from src/ - so a specification-only concept cannot be presented as implemented, and an
#     implementation cannot land without this registry noticing.
#
# Statuses: IMPLEMENTED | PARTIALLY_IMPLEMENTED | SPECIFICATION_ONLY | LEGACY_IMPLEMENTATION | BLOCKED
#
#   LEGACY_IMPLEMENTATION = a pre-reset analogue exists and carries a disposition in
#   LEGACY-DISPOSITION.md, but the CANONICAL concept is not built. It must never be read as
#   "done" - it is the thing the owning unit replaces.

concepts:

  - name: Tenant
    status: IMPLEMENTED
    specification: docs/architecture/decisions/ADR-001-authority-model.md
    evidence:
      - path: src/freight_recon/tenant.py
        symbol: require_tenant
      - path: src/freight_recon/workflow.py
        symbol: _require_schema_ready
    owning_unit: P2
    note: required at construction, sentinel-validated, first in every key, DB-enforced

  - name: Commit Key
    status: IMPLEMENTED
    specification: docs/architecture/decisions/ADR-009-concurrency-and-reservations.md
