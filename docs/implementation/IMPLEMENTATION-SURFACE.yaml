  - name: Adapter containment boundary (P4)
    status: PARTIALLY_IMPLEMENTED
    specification: docs/specifications/acceptance/adapter-boundary-acceptance.md
    evidence:
      - path: src/freight_recon/effect_boundary.py
        symbol: execute_effect
      - path: src/freight_recon/effect_boundary.py
        symbol: ExecutionCapability
      - path: src/freight_recon/effect_boundary.py
        symbol: detect_orphan_effect_attempts
      - path: eval/phase0/import_probe.py
        symbol: effect_adapter_import_violations
    owning_unit: P4
    note: >-
      The containment BOUNDARY exists and is acceptance- and mutation-proven: the single-door
      execute_effect algorithm (claim CAS -> record EffectAttempted -> touch world once with an
      unforgeable single-use capability -> verify), the CLAIMED->ATTEMPTED->VERIFIED/
      UNKNOWN_OUTCOME/FAILED outcome machine that never downgrades UNKNOWN to FAILED, orphan
      detection (Sev-0 + auto-brake), the cross-tenant GLOBAL-brake path, and the boundary-aware
      import gate (detection). PARTIALLY, not fully, IMPLEMENTED and SHIPS DARK: no production path
      routes through it yet, EP-6/7/9/10 are deleted, the brain_runtime edge has since been cut by
      injection, EP-8 has been cut to the structurally read-only observer (U4.7) and EP-3 to the
      read-only navigator (U4.8) - whose traversal was then bound at U4.8b to a re-derived,
      row-and-identity PROVENANCE RECORD, because a same-origin page-published href is not
      inherently read-only and the earlier "any published link" rule would have followed a
      state-changing GET. EP-14 was then cut at U4.10 by splitting the browser-use adapter: the
      write ledger AND the arbitrary-task browser-agent runner moved into the pre-registered
      browser_use_write slot, so the read half can no longer express a write. EP-1's WRITE was then
      cut (this session, U4.12): the callback server's _build_live_operation_router (CdpActuator +
      OperatorAgent) is DELETED, its Slack approval no longer drives an actuator, and the invoice
      write is routed to the DARK governed effect boundary (effect_boundary.execute_invoice_write, a
      typed InvoiceWriteOperation behind checkpoint/witness/grant/claim, no production caller;
      propose_ar_from_tms.py --autonomous, which reached the same factory, is refused). So the surface
      is now ZERO effect-capable
      violation edges - the exact set recorded in phase-0-baseline-manifest.yaml
      effect_adapter_import_gate.violation_edges (now empty) and recomputed live by the import probe,
      and the gate asserts EMPTY. That is the R-07 MECHANICAL close condition. R-07 nevertheless stays
      OPEN - NOT CONTAINED: recording it CONTAINED / P4 COMPLETE is the ADJUDICATION step, which
      requires a session that did not implement this cut (CLAUDE.md sec 11) and is PENDING.

