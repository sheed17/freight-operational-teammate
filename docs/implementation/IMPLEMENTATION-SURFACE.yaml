        symbol: material_facts_json
    owning_unit: P3
    note: >-
      stored as a ledger column (the content travels with the grant); the canonical fingerprint
      and drift-voiding are checkpoint step 2 and do NOT exist yet

  - name: Effect Grant ledger (foundation)
    status: IMPLEMENTED
