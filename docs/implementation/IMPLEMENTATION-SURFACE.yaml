        symbol: LogicalEffect
      - path: src/freight_recon/commit_key.py
        symbol: CanonicalOccurrence
    owning_unit: P1
    note: amount provably excluded; occurrence identity canonical; forward-only

  - name: Material Facts
    status: PARTIALLY_IMPLEMENTED
    specification: docs/architecture/decisions/ADR-005-approval-binding-and-drift.md
